      ctx.globalAlpha = q < 0.1 ? q / 0.1 : q > 0.78 ? (1 - q) / 0.22 : 1;
      ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 16 * u; ctx.shadowOffsetY = 5 * u;
      ctx.drawImage(cv, -size / 2, -size / 2, size, size);
      ctx.restore();
      return true;
    });
    setTimeout(() => { Snd.play('seal'); FX.ring(x, y, 'rgba(210,58,38,0.85)', size * 0.5, size * 1.15, 4 * u, 0.4); }, 120 / this.speed());
    if (UI.touch && PROFILE.settings.haptics !== false && navigator.vibrate) { try { navigator.vibrate(18); } catch (e2) { /* unsupported */ } }
  },
  async play(res) {
    const run = UI.run, w = run.w, h = run.h;
    this.playing = true; this.fast = false;
    this.cur = { strokes: [] };
    let cellN = 0, addN = 0, lastCellAt = 0;
    const colOf = { c: '#8cc8f8', m: '#ff9a82', x: '#ffd27a', g: '#ffe08a' };
    const u = UI.s;
    const strokeMap = {};
    const boardVP = Play.toViewport(Play.bx + w * Play.cs * 0.5, Play.by + h * Play.cs * 0.5);
    for (let i = 0; i < res.ev.length; i++) {
      const e = res.ev[i];
      switch (e.t) {
        case 'begin': {
          Snd.play('ignite');
          BG.pulse(0.5);
          FX.shake(3 * u);
          Hud.setCalc(e.c, e.m, true);
          if (e.nul) {
            FX.text(boardVP.x, boardVP.y, T('nul.' + e.nul), '#ff8a73', 34 * u, { life: 1.3, vy: -30, font: FONT_KAI });
            Snd.play('deny');
            await this.wait(700);
          } else await this.wait(160);
          break;
        }
        case 'stroke': {
          const s = { kind: e.kind, i: e.i, p: 0, a: 1 };
          strokeMap[e.si] = s;
          this.cur.strokes[e.si] = s;
          Play.strokes.push(s);
          Snd.play('stroke', e.si);
          // the brush runs a little ahead of the counting
          const n = e.idxs.length, per = clamp(46 - cellN * 0.45, 15, 46);
          const dur = (n * per * 0.9) / this.speed(), t0 = nowMs();
          const tick = () => { const q = clamp((nowMs() - t0) / Math.max(1, dur), 0, 1); s.p = Math.max(s.p, 0.06 + 0.94 * q); if (q < 1 && this.playing) requestAnimationFrame(tick); };
          tick();
          break;
        }
        case 'cell': {
          cellN++;
          const p = Play.cellVP(e.i);
          if (e.dead) { Play.pops.set(e.i, { t0: Play.t, col: '#6b6359' }); Snd.play('dead'); }
          else {
            Play.pops.set(e.i, { t0: Play.t, col: e.rep ? '#ffd27a' : '#fff3c9' });
            Snd.play('cell', cellN);
            if (e.rep) FX.text(p.x, p.y + Play.cs * u * 0.2, T('fx.again'), '#ffd27a', Play.cs * u * 0.3, { life: 0.5, vy: -30, font: FONT_KAI });
          }
          lastCellAt = nowMs();
          await this.wait(clamp(46 - cellN * 0.45, 15, 46));
          break;
        }
        case 'add': {
          addN++;
          Hud.setCalc(e.c, e.m, true);
          const pos = this.srcPos(e.src);
          const base = e.src && e.src.k === 'cell' && e.k === 'c' && e.v === CELL_CHIPS;
          const txt = e.k === 'x' ? fmtX(e.v) : e.k === 'g' ? '+' + e.v + (LANG === 'zh' ? '文' : '$') : '+' + fmtMult(e.v);
          if (pos) {
            const size = pos.size * (base ? 0.72 : e.k === 'x' ? 1.3 : 1);
            const jx = base ? 0 : (Math.random() - 0.5) * pos.size * 0.8;
            FX.text(pos.x + jx, pos.y, txt, colOf[e.k], size, { life: base ? 0.45 : pos.big ? 1.2 : 0.8, vy: base ? -40 : -62 });
            if (pos.seal) { Hud.popSeal(pos.seal); FX.ring(pos.x, pos.y + pos.size, 'rgba(255,190,120,0.9)', pos.size * 0.6, pos.size * 1.8, 3 * u, 0.35); }
            if (e.k === 'x') FX.spark(pos.x, pos.y, '#ffd27a', pos.big ? 40 : 12, (pos.big ? 420 : 220) * u, 2.4 * u);
            if (e.k === 'g') FX.spark(pos.x, pos.y, '#ffe08a', 8, 160 * u, 2 * u);
          }
          if (e.src && e.src.k === 'char') {
            // the character multiplier: the written glyph flares
            Snd.play('char', UI.run.lastTier);
            this.cur.flared = true;
            FX.shake(Math.min(14, 5 + Math.log10(Math.max(10, e.c * e.m))) * u);
            FX.flash('#fff3d0', 0.16);
            FX.ring(boardVP.x, boardVP.y, 'rgba(255,214,120,0.9)', Play.cs * u, Play.cs * u * 5.5, 6 * u, 0.6);
            BG.pulse(0.9);
            for (const s of Play.strokes) { s.base = s.col; s.col = '#7a160c'; }
            await this.wait(430);
            for (const s of Play.strokes) s.col = s.base;
          } else if (!base) {
            if (e.k === 'x') Snd.play('xmult', addN); else if (e.k === 'g') Snd.play('coin'); else if (e.k === 'm') Snd.play('mult', addN); else Snd.play('chips', addN);
            if (pos && pos.seal) { Snd.play('seal'); await this.wait(200); }
            else if (e.src && e.src.k === 'pure') await this.wait(150);
            else if (e.src && (e.src.k === 'buff' || e.src.k === 'su')) await this.wait(120);
            else await this.wait(e.k === 'x' ? 90 : 34);
          }
          break;
        }
        case 'say': {
          const pos = this.srcPos(e.src);
          if (pos) { FX.text(pos.x, pos.y - pos.size * 0.5, tx(e.txt), '#f3e6c8', pos.size * 0.8, { life: 0.9, vy: -50, font: FONT_KAI }); if (pos.seal) Hud.popSeal(pos.seal); }
          await this.wait(180);
          break;
        }
        case 'pure': {
          Snd.play('pure');
          const s = strokeMap[e.si];
          if (s) { s.col = INK[e.ink].col; }
          const pos = this.srcPos({ k: 'pure', si: e.si });
          if (pos) FX.text(pos.x, pos.y - pos.size * 0.9, T('fx.pure', nm(INK[e.ink])), INK[e.ink].hi, pos.size * 0.8, { life: 0.9, vy: -34, font: FONT_KAI });
          break;
        }
        case 'strokeEnd': {
          const s = strokeMap[e.si];
          if (s) s.p = 1;
          await this.wait(70);
          break;
        }
        case 'total': {
          await this.wait(220);
          if (!e.nul) {
            Snd.play('total');
            if (!this.cur.flared) Snd.play('char', 1);
            this.stamp(res, boardVP, u);
            const big = fmtNum(e.score);
            const size = clamp(74 - big.length * 2.2, 38, 74) * u;
            FX.text(boardVP.x, boardVP.y + Play.cs * u * 0.55, big, '#fff3c9', size, { life: 1.15, vy: -16, edge: 'rgba(60,12,6,0.95)' });
            FX.ink(boardVP.x, boardVP.y, '#1b1918', 26, 520 * u, 7 * u);
            const mag = Math.log10(Math.max(10, e.score));
            FX.shake(Math.min(18, 2 + mag * 1.6) * u);
            BG.pulse(Math.min(1.6, 0.2 + mag * 0.14));
            await this.wait(520);
          }
          const before = Hud._score;
          const done = Hud.setScore(e.sum, true);
          if (before < e.target && e.sum >= e.target) {
            const sc = UI.center(Hud.el.score);
            Snd.play('flame');
            const burn = () => { if (!this.playing) return; FX.rise(sc.x, sc.y + sc.h * 0.3, Math.random() < 0.5 ? '#ffb05a' : '#ff6a3c', 5, sc.w * 0.9, 4 * u); };
            const iv = setInterval(burn, 40);
            setTimeout(() => clearInterval(iv), 1400);
            FX.flash('#ffb05a', 0.14);
          }
          await done;
          break;
        }
        case 'clear': {
          // the strokes lift off the paper and the ink they were written with is gone
          const cells = e.cells;
          const board = Play.viewBoard;
          for (const i of cells) {
            const p = Play.cellVP(i), cell = board && board[i];
            if (cell && Math.random() < (cells.length > 40 ? 0.4 : 0.8)) FX.ink(p.x, p.y, cell.stone ? '#8a8378' : INK[cell.ink].col, 3, 210 * u, 4.5 * u);
            Play.hidden.add(i);
          }
          Play.inkDirty = true;
          const t0 = nowMs(), dur = 360 / this.speed();
          await new Promise((r) => {
            const tick = () => {
              const q = clamp((nowMs() - t0) / Math.max(1, dur), 0, 1);
              for (const s of Play.strokes) { s.a = 1 - q; s.scale = 1 + 0.07 * q; }
              if (q < 1) requestAnimationFrame(tick); else r();
            };
            tick();
          });
          Play.strokes.length = 0;
          if (board) for (const i of cells) board[i] = null;
          for (const i of cells) Play.hidden.delete(i);
          Play.inkDirty = true;
          break;
        }
        case 'shatter': {
          Snd.play('shatter');
          FX.text(boardVP.x, boardVP.y - Play.cs * u, T('fx.shatter', nm(SHAPES[e.shape])), '#ff9a82', 26 * u, { life: 1.3, vy: -30, font: FONT_KAI });
          await this.wait(350);
          break;
        }
        case 'yi': {
          const c = UI.center(Hud.el.glyph);
          const d = YI[e.yi];
          Snd.play(e.yi.startsWith('money') ? 'coin' : 'level');
          FX.ring(c.x, c.y, 'rgba(120,220,170,0.9)', c.w * 0.4, c.w * 1.3, 4 * u, 0.5);
          toast({ iconEl: Gfx.glyphCanvas(e.char, 34, '#1b1918'), title: T('fx.yi', CH[e.char].g), text: rich(dtx(d)) + (e.item ? (e.got ? ' — ' + nm(ITEMS[e.item]) : ' — ' + T('fx.noroom')) : e.tier ? ' — ' + (LANG === 'zh' ? TIER_NAME.zh[e.tier] : TIER_NAME.en[e.tier]) : ''), ms: 2600 });
          if (e.cells) { for (const i of e.cells) { const p = Play.cellVP(i); FX.ink(p.x, p.y, '#c9bfa8', 2, 160 * u, 4 * u); if (Play.viewBoard) Play.viewBoard[i] = null; } Play.inkDirty = true; }
          await this.wait(300);
          break;
        }
        case 'wipe': case 'wash': {
          Snd.play('rinse');
          for (const i of e.cells) { const p = Play.cellVP(i); FX.ink(p.x, p.y, '#6fa8d8', 2, 180 * u, 4 * u); if (Play.viewBoard) Play.viewBoard[i] = null; }
          Play.inkDirty = true;
          await this.wait(260);
          break;
        }
        case 'bossCash': {
          const c = UI.center(Hud.el.money);
          Snd.play('deny');
          FX.text(c.x, c.y, e.v + (LANG === 'zh' ? '文' : '$'), '#ff8a73', 26 * u, { life: 1 });
          break;
        }
        case 'sealGone': {
          toast({ icon: '逝', title: T('fx.sealgone', nm(SEALS[e.id])), ms: 2600 });
          break;
        }
        case 'rescue': {
          Snd.play('level');
          toast({ icon: '生', title: nm(SEALS[e.id]), text: T('fx.rescue'), ms: 3200 });
          await this.wait(500);
          break;
        }
        default: break;
      }
    }
    Play.strokes.length = 0; Play.hidden.clear(); Play.viewBoard = null; Play.inkDirty = true;
    this.playing = false; this.fast = false; this.cur = null;
  },
};

// ---------- game controller: actions, round flow, sheet selection and payout ----------
const Game = {
  _tick: 0, _sealSig: '',
  save() {
    const run = UI.run;
    if (run) {
      const now = nowMs();
      if (this._tick) run.stats.time += Math.min(60, (now - this._tick) / 1000);
      this._tick = now;
    }
    PROFILE.run = run && run.phase !== 'over' ? run : null;
    saveProfile();
  },
  begin(opts) {
    closeAllModals();
    const run = newRun(Object.assign({ pool: unlockedPool() }, opts));
    UI.run = run;
    this._tick = nowMs();
    this.save();
    this.enter();
  },
  resume() {
    if (!PROFILE.run) return false;
    UI.run = PROFILE.run;
    this._tick = nowMs();
    this.enter();
    return true;
  },
  enter() {
    UI.busy = false;
    UI.screen('game');
    Play.cancelDrag(); Play.kb = null; Play.rinseMode = false; Play.target = null; Play.viewBoard = null; Play.strokes.length = 0; Play.hidden.clear(); Play.pops.clear(); Play.flashCells.clear(); Play.lineFlash.length = 0; Play.trayUid = [];
    FX.clear();
    Hud._patKey = ''; Hud._score = 0;
    this.route();
  },
  route() {
    const run = UI.run;
    this.hideStuck();
    switch (run.phase) {
      case 'pick': this.showPick(); break;
      case 'round': this.showRound(false); break;
      case 'cash': this.showCash(); break;
      case 'shop': Shop.show(); break;
      case 'won': Hud.refresh(); Menu.victory(); break;
      default: Menu.gameOver(); break;
    }
  },
  mood() {
    const run = UI.run, rd = run.round;
    const m = run.phase === 'shop' ? 'shop' : run.phase === 'round' && rd && rd.boss ? 'boss' : 'calm';
    BG.mood(m); Snd.setMusic(m);
  },
  showRound(fresh) {
    const run = UI.run;
    Hud.view(null);
    Hud._patKey = '';
    Hud.refresh();
    Play.layout();
    this.mood();
    if (fresh && run.round.boss) {
      const b = BOSSES[run.round.boss];
      Snd.play('boss');
      FX.flash('#7a160c', 0.25);
      toast({ icon: '帖', title: '《' + nm(b) + '》', text: rich(dtx(b).split('\n')[0]), ms: 4200 });
    }
    this.checkStuck();
    Tutorial.on('round');
  },
  refresh() {
    Hud.refresh();
    Play.inkDirty = true;
  },

  // ---- actions on the sheet
  place(slot, x, y) {
    const run = UI.run;
    if (UI.busy || run.phase !== 'round') return;
    const before = findLines(run);
    const r = placeBlock(run, slot, x, y);
    if (!r.ok) { Snd.play('bad'); return; }
    Play.inkDirty = true;
    for (const y2 of r.lines.rows) if (!before.rows.includes(y2)) Play.lineFlash.push({ kind: 'row', i: y2, t0: Play.t });
    for (const x2 of r.lines.cols) if (!before.cols.includes(x2)) Play.lineFlash.push({ kind: 'col', i: x2, t0: Play.t });
    const u = UI.s;
    for (const i of r.cells) {
      Play.flashCells.set(i, Play.t);
      const p = Play.cellVP(i);
      FX.ink(p.x, p.y, INK[r.ink].col, 2, 130 * u, 3.4 * u);
    }
    Snd.play('place', r.cells.length);
    if (UI.touch && PROFILE.settings.haptics !== false && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { /* unsupported */ } }
    if (r.newLines > 0) {
      Snd.play('line', r.lines.n);
      BG.pulse(0.22);
      const c = UI.center(Hud.el.glyph);
      FX.ring(c.x, c.y, 'rgba(243,217,139,0.9)', c.w * 0.4, c.w * 1.1, 3 * u, 0.4);
    }
    this.sheetEvents(r.ev);
    this.after();
    Tutorial.on('place', r);
  },
  sheetEvents(ev) {
    const u = UI.s;
    for (const e of ev) {
      if (e.t === 'wash') { Snd.play('rinse'); for (const i of e.cells) { const p = Play.cellVP(i); FX.ink(p.x, p.y, '#6fa8d8', 3, 200 * u, 4 * u); } this.say(T('say.wash')); }
      else if (e.t === 'blot') { Snd.play('stone'); const p = Play.cellVP(e.i); FX.ink(p.x, p.y, '#3a3531', 8, 220 * u, 4 * u); FX.shake(3 * u); }
    }
    if (ev.length) Play.inkDirty = true;
  },
  discard(slot) {
    const run = UI.run;
    if (UI.busy || run.phase !== 'round') return;
    if (run.round.discards <= 0) { Snd.play('deny'); this.say(T('say.norinse')); return; }
    const r = discardBlock(run, slot);
    if (!r.ok) { Snd.play('bad'); Play.nope(slot); return; }
    Snd.play('rinse');
    const c = UI.center(Hud.el.rinse);
    FX.ink(c.x, c.y, '#6fa8d8', 14, 260 * UI.s, 4 * UI.s);
    this.after();
    Tutorial.on('discard');
  },
  after() {
    Hud.refresh();
    this.save();
    metaOnState(UI.run);
    showAchievements();
    this.checkStuck();
  },
  async ignite() {
    const run = UI.run;
    if (UI.busy || run.phase !== 'round' || modalOpen()) return;
    const rd = run.round;
    if (rd.ignites <= 0 || !findLines(run).n) { Snd.play('deny'); if (rd.ignites > 0) this.say(T('say.nolines')); return; }
    if (PROFILE.settings.confirmIgnite) {
      const pat = currentPattern(run);
      const ok = await confirmBox(T('ignite'), T('confirm.ignite', pat.id === 'sanbi' ? T('sanbi') : CH[pat.id].g), T('ignite'), T('cancel'));
      if (!ok) return;
    }
    Play.cancelDrag(); Play.kb = null; Play.setGhost(null); Play.setRinse(false);
    this.hideStuck();
    const snapshot = rd.board.slice();
    const inkZero = rd.ink === 0;
    const res = ignite(run);
    if (!res) return;
    UI.busy = true;
    Play.viewBoard = snapshot; Play.inkDirty = true;
    Hud.buttons();
    hidePop(); hideTip();
    // bookkeeping for the profile
    res.inkZero = inkZero && !res.nul;
    const sts = res.ev.filter((e) => e.t === 'stroke').length, pures = res.ev.filter((e) => e.t === 'pure').length;
    res.pureAll = !res.nul && sts >= 2 && pures === sts;
    const seq = rd.chars; let k = 0;
    for (const id of seq) { if (id === ['yi', 'er', 'san'][k]) k++; if (k === 3) break; }
    res.seq123 = k === 3;
    const isNew = metaOnIgnite(run, res);
    this.save();
    await Score.play(res);
    UI.busy = false;
    if (isNew) toast({ iconEl: Gfx.glyphCanvas(res.char, 34, '#1b1918'), title: T('fx.newchar', CH[res.char].g + (LANG === 'en' ? ' · ' + CH[res.char].en : '')), text: escHtml(LANG === 'zh' ? CH[res.char].gz : CH[res.char].ge), ms: 4800, snd: 'newchar' });
    metaOnState(run);
    if (res.won) {
      if (rd.boss) metaOnBoss(run, rd.boss);
      showAchievements();
      Snd.play('win');
      FX.flash('#fff3d0', 0.2);
      this.save();
      await wait(650);
      this.showCash();
    } else if (res.lost) {
      showAchievements();
      this.save();
      await wait(500);
      this.finish();
    } else {
      this.after();
      Tutorial.on('ignite', res);
    }
  },
  checkStuck() {
    const run = UI.run;
    if (run.phase !== 'round' || UI.busy) { this.hideStuck(); return; }
    if (hasMove(run)) { this.hideStuck(); return; }
    if (this._stuck) return;
    const bar = h('div.panel.stuckbar', h('span', { text: T('stuck') }), mkBtn(T('stuck.end'), 'red small', () => this.giveUp()));
    this._stuck = bar;
    Hud.el.center.appendChild(bar);
  },
  hideStuck() { if (this._stuck) { this._stuck.remove(); this._stuck = null; } },
  giveUp() {
    const run = UI.run;
    if (run.phase !== 'round' || UI.busy) return;
    this.hideStuck();
    concede(run);
    this.save();
    if (run.phase === 'cash') { Snd.play('win'); this.showCash(); } else this.finish();
  },
  say(text) {
    const tb = Hud.el.traybox.getBoundingClientRect();
    FX.text(tb.left + tb.width / 2, tb.top - 6 * UI.s, text, '#f3d98b', 24 * UI.s, { life: 1.5, vy: -18, font: FONT_KAI, weight: 700 });
  },
  // the run is over (lost or abandoned)
  finish() {
    const run = UI.run;
    if (run.phase !== 'over') loseRun(run);
    if (!run.recorded) { run.recorded = true; metaOnRunEnd(run, false); }
    PROFILE.run = null;
    saveProfile(true);
    showAchievements();
    Menu.gameOver();
  },
  abandon() {
    const run = UI.run;
    if (!run) return;
    if (!run.recorded) { run.recorded = true; metaOnRunEnd(run, !!run.won); }
    PROFILE.run = null; UI.run = null;
    saveProfile(true);
    Menu.title();
  },

  // ---- selling and using
  sellSeal(uid) {
    const run = UI.run;
    if (UI.busy) return;
    const el = Hud.sealEl(uid), c = el ? UI.center(el) : null;
    const v = sellSeal(run, uid);
    if (v === false) return;
    if (c) { FX.spark(c.x, c.y, '#ffe08a', 14, 240 * UI.s, 2.4 * UI.s); FX.text(c.x, c.y, '+' + v, '#ffe08a', 26 * UI.s); }
    Hud._sealSig = '';
    this.afterMeta();
  },
  sellItem(idx) {
    const run = UI.run;
    if (UI.busy) return;
    const v = sellItem(run, idx);
    if (v === false) return;
    const c = UI.center(Hud.el.itemList);
    FX.text(c.x, c.y, '+' + v, '#ffe08a', 26 * UI.s);
    this.afterMeta();
  },
  afterMeta() {
    const run = UI.run;
    Hud.refresh(); Play.inkDirty = true;
    if (run.phase === 'shop') Shop.render();
    if (run.phase === 'round') { Play.layoutTray(); this.checkStuck(); }
    this.save();
    metaOnState(run);
    showAchievements();
  },
  async useItemFlow(idx) {
    const run = UI.run;
    if (UI.busy) return;
    const it = run.items[idx];
    if (!it) return;
    const def = ITEMS[it.id];
    const u = itemUsable(run, def);
    if (!u.ok) { Snd.play('deny'); this.say(u.why === 'round' ? T('say.roundonly') : T('say.cannot')); return; }
    const target = await Targets.choose(def);
    if (!target) return;
    const before = this.snapshotForItem(def);
    const r = useItem(run, run.items.findIndex((x) => x.uid === it.uid), target);
    if (!r.ok) { Snd.play('deny'); return; }
    this.itemFeedback(def, before);
    this.afterMeta();
  },

  itemFeedback(def, before) {

    const card = h('div.panel.cashcard');

    card.appendChild(h('div.sc', { html: T('cash.score', `<b>${fmtNum(cash.score)}</b>`, fmtNum(cash.target)) }));
    const rows = [];
    for (const l of cash.lines) {
      const label = l.k === 'blind' ? T('cash.blind', cash.boss ? '《' + nm(BOSSES[cash.boss]) + '》' : tx(BLIND_NAME[cash.blind]))
        : l.k === 'ignites' ? T('cash.ignites', l.n) : l.k === 'interest' ? T('cash.interest') : l.k === 'double' ? T('cash.double') : nm(SEALS[l.id]);
      const row = h('div.cashline', h('span', { text: label }), h('span.v', { html: coinHtml('+' + l.v) }));
      rows.push(row); card.appendChild(row);
    }
    if (!cash.lines.length) card.appendChild(h('div.cashline.in', h('span.dim', { text: T('cash.none') }), h('span.v', { html: coinHtml(0) })));
    const tot = h('span.v', { html: coinHtml(0) });
    card.appendChild(h('div.cashtotal', h('span', { text: T('cash.total') }), tot));
    const btn = mkBtn(T('cash.collect'), 'gold', () => this.collect());
    btn.id = 'btn-collect';
    btn.style.width = '100%';
    btn.disabled = true;
    card.appendChild(btn);
    V.appendChild(card);
    Hud.view('viewCash');
    let sum = 0;
    (async () => {
      for (let i = 0; i < rows.length; i++) {
        await wait(220 / Score.speed());
        if (!rows[i].isConnected) return;
        rows[i].classList.add('in');
        sum += cash.lines[i].v;
        tot.innerHTML = coinHtml(sum);
        Snd.play('coin');
      }
      await wait(160);
      btn.disabled = false;
    })();
  },
  collect() {
    const run = UI.run;
    if (run.phase !== 'cash') return;
    const c = UI.center(Hud.el.money);
    FX.spark(c.x, c.y, '#ffe08a', 22, 300 * UI.s, 2.6 * UI.s);
    Snd.play('buy');
    collectCash(run);
    Play.viewBoard = null;
    if (run.phase === 'won' && !run.winRecorded) { run.winRecorded = true; metaOnWin(run); }
    metaOnState(run);
    this.save();
    showAchievements();
    this.route();
  },
};

// ---- choosing what an item acts on
const Targets = {
  choose(def) {
    if (!def.need) return Promise.resolve({});
    if (def.need.t === 'pieces') return this.pieces(def);
    return this.square(def);
  },
  pieces(def) {
    const run = UI.run, nd = def.need, min = nd.min || 1;
    return new Promise((res) => {
      const sel = new Set();
      let done = false, okBtn = null, grid = null;
      const order = { mo: 0, zhu: 1, qing: 2, jin: 3 };
      const list = run.deck.slice().sort((a, b) => order[a.ink] - order[b.ink] || SHAPES[a.shape].n - SHAPES[b.shape].n || a.shape.localeCompare(b.shape));
      const upd = () => {
        okBtn.disabled = sel.size < min;
        okBtn.innerHTML = `${T('ok')} <span class="sub">${sel.size}/${nd.max}</span>`;
        grid.querySelectorAll('.pc').forEach((e) => e.classList.toggle('sel', sel.has(+e.dataset.uid)));
      };
      const m = openModal({
        title: nm(def), sub: T('target.pieces', nd.max), width: Math.min(UI.W - 30, 860),
        body: (root) => {
          root.appendChild(h('div', { html: rich(itemDesc(def.id, run)), style: { marginBottom: '10px', fontSize: '18px', color: '#e8dcc6' } }));
          grid = h('div.deckgrid');
          for (const p of list) {
            const el = h('div.pc', { data: { uid: p.uid } }, Gfx.pieceCanvas(p.shape, p.ink, p.enh, UI.orient === 'p' ? 19 : 15, PROFILE.settings.marks));
            if (p.enh) el.appendChild(h('span.tg', { text: ENH[p.enh].g }));
            el.addEventListener('click', () => {
              if (sel.has(p.uid)) sel.delete(p.uid);
              else { if (nd.max === 1) sel.clear(); if (sel.size >= nd.max) { Snd.play('bad'); return; } sel.add(p.uid); }
              Snd.play('tick'); upd();
            });
            bindCard(el, () => pieceCard(p), { noClick: true });
            grid.appendChild(el);
          }
          root.appendChild(grid);
        },
        buttons: [{ label: T('cancel'), cls: 'ghost' }, { label: T('ok'), cls: 'gold', id: 'btn-target-ok', fn: () => { done = true; res({ pieces: [...sel] }); } }],
        onClose: () => { if (!done) res(null); },
      });
      okBtn = m.foot.querySelector('#btn-target-ok');
      upd();
    });
  },
  square(def) {
    const run = UI.run, nd = def.need, rd = run.round, inRound = run.phase === 'round' && rd;
    const ok = (i) => {
      if (inRound && rd.holes[i]) return false;
      if (nd.t === 'cell') return nd.empty ? !rd.board[i] : true;
      return true;
    };
    if (inRound && Play.active && !modalOpen()) {
      // pick straight on the sheet
      return new Promise((res) => {
        const bar = h('div.panel.stuckbar', { style: { borderColor: 'rgba(120,220,170,0.7)' } }, h('span', { text: T('target.square', nm(def)), style: { color: '#b6ecd4' } }),
          mkBtn(T('cancel'), 'ghost small', () => finish(null)));
        const finish = (v) => { Play.target = null; bar.remove(); res(v == null ? null : { square: v }); };
        Hud.el.center.appendChild(bar);
        Play.target = { ok, pick: (i) => { Snd.play('click'); finish(i); } };
      });
    }
    return new Promise((res) => {
      let done = false;
      openModal({
        title: nm(def), sub: T('target.square.sub'), width: Math.min(UI.W - 30, 620),
        body: (root, close) => {
          root.appendChild(h('div', { html: rich(itemDesc(def.id, run)), style: { marginBottom: '12px', fontSize: '18px', color: '#e8dcc6', textAlign: 'center' } }));
          const cell = Math.floor(Math.min(56, (Math.min(UI.W - 90, 560)) / run.w - 4));
          const grid = h('div.paperpick', { style: { gridTemplateColumns: `repeat(${run.w}, ${cell}px)`, width: 'max-content' } });
          for (let i = 0; i < run.w * run.h; i++) {
            const sq = run.paper[i];
            const b = h('button', { type: 'button', style: { width: cell + 'px', height: cell + 'px' }, text: sq ? SQ[sq].g : '' });
            if (sq) { b.classList.add('has'); b.style.setProperty('--sq', SQ[sq].col); }
            if (inRound && rd.board[i]) { b.classList.add('ink'); b.classList.add(rd.board[i].stone ? 'stone' : rd.board[i].ink); }
            if (!ok(i)) b.disabled = true;
            b.addEventListener('click', () => { Snd.play('click'); done = true; res({ square: i }); close(); });
            grid.appendChild(b);
          }
          root.appendChild(grid);
        },
        buttons: [{ label: T('cancel'), cls: 'ghost' }],
        onClose: () => { if (!done) res(null); },
      });
    });
  },
};

// ---------- overlays: Ink Box, lexicon, run record, collection, settings, help ----------
function recipeText(id) {
  const def = CH[id], zh = LANG === 'zh';
  if (id === 'xuan') return T('recipe.full');
  if (id === 'sanbi') return T('recipe.san');
  const tot = (s) => s[0] + s[1] + s[2];
  const one = (s, row) => {
    const out = [];
    if (row) {
      if (s[0]) out.push(zh ? '顶横' : 'the top row');
      if (s[1]) out.push(zh ? `中间${s[1] > 1 ? s[1] + '条' : '一条'}横` : `${s[1]} inner row${s[1] > 1 ? 's' : ''}`);
      if (s[2]) out.push(zh ? '底横' : 'the bottom row');
    } else {
      if (s[0]) out.push(zh ? '左竖' : 'the left column');
      if (s[1]) out.push(zh ? `中间${s[1] > 1 ? s[1] + '条' : '一条'}竖` : `${s[1]} inner column${s[1] > 1 ? 's' : ''}`);
      if (s[2]) out.push(zh ? '右竖' : 'the right column');
    }
    return out.join(zh ? '、' : ', ');
  };
  const part = (specs, row) => {
    if (!specs.length) return '';
    const n = tot(specs[0]);
    if (!n) return '';
    if (specs.length === anyLines(n).length) return zh ? `任意${n}条${row ? '横' : '竖'}` : `any ${n} ${row ? 'row' : 'column'}${n > 1 ? 's' : ''}`;
    return specs.map((sp) => one(sp, row)).join(zh ? ' 或 ' : ' or ');
  };
  const parts = [part(def.rowSpecs, true), part(def.colSpecs, false)];
  if (def.d === 1) parts.push(zh ? '捺（左上至右下的对角线）' : 'the ↘ diagonal');
  if (def.d === 2) parts.push(zh ? '撇（右上至左下的对角线）' : 'the ↙ diagonal');
  if (def.d === 3) parts.push(zh ? '两条对角线' : 'both diagonals');
  return parts.filter(Boolean).join(zh ? ' ＋ ' : '  +  ');
}

      c.setTransform(k, 0, 0, k, 0, 0);
      c.clearRect(0, 0, size, size);
      S.forEach((s, i) => Gfx.brush(c, s[0] * size, s[1] * size, s[2] * size, s[3] * size, s[4] * size, i < p ? '#f3d98b' : 'rgba(243,217,139,0.13)', i < Math.floor(p) ? 1 : i === Math.floor(p) ? p - Math.floor(p) : 1, i * 31 + 7, i < p));
    };
    draw(prog);
    return { cv, draw };
  },
  victory() {
    const run = UI.run;
    closeAllModals();
    Tutorial.hide();
    BG.mood('win'); Snd.setMusic('title');
    Snd.play('victory');
    FX.flash('#f3d98b', 0.3);
    openModal({
      dismiss: false, width: Math.min(UI.W - 30, 760),
      body: (root) => {
        const w = h('div.endwrap.win');
        const y = this.yong(UI.orient === 'p' ? 230 : 170, 0);
        w.appendChild(y.cv);
        w.appendChild(h('div.big', { text: T('end.win') }));
        w.appendChild(h('div', { html: T('end.win.d', nm(DECKS[run.deckId]), nm(STAKES[run.stake])), style: { fontSize: '20px', color: '#e8dcc6' } }));
        w.appendChild(this.endStats(run));
        if (run.seals.length) w.appendChild(this.endSeals(run));
        const nxt = run.stake < STAKES.length - 1 ? T('end.win.next', nm(STAKES[run.stake + 1])) : T('end.win.top');
        w.appendChild(h('div.quote', { html: nxt }));
        root.appendChild(w);
        const t0 = nowMs();
        const anim = () => {
          if (!y.cv.isConnected) return;
          const p = clamp((nowMs() - t0 - 500) / 2600, 0, 1) * 8;
          y.draw(PROFILE.settings.reduce ? 8 : p);
          if (p < 8) requestAnimationFrame(anim);
        };
        setTimeout(anim, 30);
        const burst = () => { if (!y.cv.isConnected) return; const c = UI.center(y.cv); FX.spark(c.x + (Math.random() - 0.5) * c.w * 2, c.y + (Math.random() - 0.5) * c.h, Math.random() < 0.5 ? '#f3d98b' : '#ff9a6a', 18, 260 * UI.s, 2.6 * UI.s); };
        for (let i = 0; i < 9; i++) setTimeout(burst, 400 + i * 330);
      },
      buttons: [
        { label: T('end.title'), cls: 'ghost', keep: true, fn: () => { closeAllModals(); Game.abandon(); } },
        { label: T('end.endless'), cls: 'gold', keep: true, fn: () => { closeAllModals(); continueEndless(run); Game.save(); Game.route(); } },
      ],
    });
  },
};

// ---------- first-run coaching: small notes that point at things, never blocking play ----------
const Tutorial = {
  el: null, spot: null, target: null, pad: 8,
  active() { return !!(UI.run && UI.run.tutorial && PROFILE.meta.tutorial < 99); },
  set(v) { PROFILE.meta.tutorial = v; saveProfile(); },
  on(ev, data) {
    const run = UI.run;
    if (!run) return;
    if (ev === 'shop' && !PROFILE.meta.tips.shop) {
      PROFILE.meta.tips.shop = 1; saveProfile();
      const tgt = Hud.el.viewShop.querySelector('.shelf');
      if (tgt) this.show(tgt, T('tut.shop'), [{ label: T('tut.ok'), fn: () => this.hide() }], '');
      return;
    }
    if (!this.active()) return;
    const st = PROFILE.meta.tutorial;
    if (ev === 'pick') {
      if (st === 0) this.show($('#btn-start'), T('tut.1'), [], T('tut.step', 1, 6));
      else this.hide();
    } else if (ev === 'round') {
      if (st <= 1) { this.set(1); this.show(Hud.el.traybox, T('tut.2'), [], T('tut.step', 2, 6)); }
    } else if (ev === 'place') {
      if (st === 1 || st === 2) {
        if (data.lines.n >= 1) this.stepLine();
        else if (st === 1) { this.set(2); this.show(Hud.el.boardbox, T('tut.3'), [], T('tut.step', 3, 6), 'in'); }
      }
    } else if (ev === 'ignite') {
      if (st < 5) {
        this.set(5);
        this.show(Hud.el.char.querySelector('.calc'), T('tut.6'), [{ label: T('tut.next'), fn: () => {
          this.show(Hud.el.rinse, T('tut.7'), [{ label: T('tut.next'), fn: () => {
            this.show(Hud.el.bDict, T('tut.8'), [{ label: T('tut.done'), fn: () => { this.set(99); this.hide(); } }], T('tut.step', 6, 6));
          } }], T('tut.step', 6, 6));
        } }], T('tut.step', 5, 6));
      }
    } else if (ev === 'discard') { /* nothing to teach */ }
  },
  stepLine() {
    this.set(3);
    this.show(Hud.el.char, T('tut.4'), [{ label: T('tut.next'), fn: () => { this.set(4); this.show(Hud.el.ignite, T('tut.5'), [], T('tut.step', 4, 6)); } }], T('tut.step', 4, 6));
  },
  show(target, html, btns, step, mode) {
    this.hide();
    if (!target || !target.isConnected) return;
    this.target = target; this.mode = mode || '';
    const stage = UI.stage;
    this.spot = h('div.spot');
    const row = h('div.cbtns');
    if (this.active()) row.appendChild(mkBtn(T('tut.skip'), 'tiny ghost', () => { this.set(99); this.hide(); }));
    for (const b of btns || []) row.appendChild(mkBtn(b.label, 'tiny gold', b.fn));
    this.el = h('div.coach', step ? h('div.cstep', { text: step }) : null, h('div', { html }), row.children.length ? row : null);
    for (const b of this.el.querySelectorAll('.btn.ghost')) b.style.color = '#5d4a34';
    stage.append(this.spot, this.el);
    this.relayout();
  },
  relayout() {
    if (!this.el || !this.target) return;
    if (!this.target.isConnected) { this.hide(); return; }
    const r = UI.rect(this.target), p = this.pad;
    const s = this.spot.style;
    s.left = r.x - p + 'px'; s.top = r.y - p + 'px'; s.width = r.w + p * 2 + 'px'; s.height = r.h + p * 2 + 'px';
    const el = this.el, bw = el.offsetWidth, bh = el.offsetHeight, gap = 16;
    let x = clamp(r.x + r.w / 2 - bw / 2, 10, UI.W - bw - 10), y;
    if (this.mode === 'in') y = r.y + 14;
    else if (r.y + r.h + gap + bh < UI.H - 8) y = r.y + r.h + gap;
    else if (r.y - gap - bh > 8) y = r.y - gap - bh;
    else { y = clamp(r.y + r.h / 2 - bh / 2, 8, UI.H - bh - 8); x = r.x + r.w + gap + bw < UI.W ? r.x + r.w + gap : Math.max(10, r.x - gap - bw); }
    el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px';
  },
  hide() {
    if (this.el) this.el.remove();
    if (this.spot) this.spot.remove();
    this.el = null; this.spot = null; this.target = null;
  },
};

// ---------- boot ----------
const App = {
  started: false,
  boot() {
    loadProfile();
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    UI.layout();
    initUiCore();
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) { UI.touch = true; document.body.classList.add('touch'); }
    Gfx.init();
    FX.init();
    BG.init();
    Hud.build();
    Play.init();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.resize());
    document.addEventListener('keydown', (e) => this.key(e));
    document.addEventListener('pointerdown', () => { this.wake(); if (Score.playing) Score.fast = true; }, true);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { Game.save(); saveProfile(true); Snd.suspend(); }
      else { Game._tick = nowMs(); if (this.started) Snd.resume(); }
    });
    window.addEventListener('pagehide', () => { Game.save(); saveProfile(true); });
    window.addEventListener('beforeunload', () => { Game.save(); saveProfile(true); });
    window.addEventListener('error', (e) => this.oops(e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => this.oops(e.reason));
    Menu.title();
    const boot = document.getElementById('boot');
    requestAnimationFrame(() => requestAnimationFrame(() => { boot.classList.add('gone'); setTimeout(() => boot.remove(), 600); }));
  },
  wake() {
    // browsers only allow sound after a first gesture
    Snd.resume();
    if (!this.started && Snd.ready) { this.started = true; Snd.startMusic(); }
  },
  resize() {
    UI.layout();
    FX.resize(); BG.resize();
    hidePop(); hideTip();
    Play.cancelDrag();
    if ($('#menu').classList.contains('on')) Menu.title();
    else if (UI.run) {
      Hud._patKey = '';
      Hud.refresh();
      Play.layout();
      const p = UI.run.phase;
      if (p === 'pick' && Hud.el.viewPick.classList.contains('on')) Game.showPick();
      else if (p === 'shop') Shop.render();
    }
    Tutorial.relayout();
  },
  relang() {
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    Gfx._paper.clear();
    Tutorial.hide();
    const inMenu = $('#menu').classList.contains('on');
    Hud.build();
    Play.init();
    if (inMenu || !UI.run) Menu.title(); else Game.enter();
  },
  fullscreen() {
    const d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) { /* not available */ }
  },
  key(e) {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    this.wake();
    if (Score.playing) { Score.fast = true; if (e.key === ' ') e.preventDefault(); return; }
    if (modalOpen()) { if (e.key === 'Escape') { closeTopModal(); e.preventDefault(); } return; }
    if (e.key === 'Escape' && _popAnchor) { hidePop(); return; }
    if (!$('#game').classList.contains('on') || !UI.run) return;
    const run = UI.run;
    if (run.phase === 'round') {
      if (Play.target) { if (e.key === 'Escape') { const b = Hud.el.center.querySelector('.stuckbar .btn'); if (b) b.click(); } return; }
      if (Play.key(e)) { e.preventDefault(); return; }
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (run.phase === 'pick') Game.startRound();
      else if (run.phase === 'cash') { const b = $('#btn-collect'); if (b && !b.disabled) b.click(); }
      return;
    }
    if (e.key === 'Escape') { Overlays.pause(); e.preventDefault(); }
    else if (e.key === 'z' || e.key === 'Z') Overlays.dictionary();
    else if (e.key === 'x' || e.key === 'X') Overlays.deck();
    else if (e.key === 'c' || e.key === 'C') Overlays.runInfo();
  },
  _oops: 0,
  oops(err) {
    // never leave the player locked out because one frame went wrong
    if (typeof console !== 'undefined') console.error(err);
    UI.busy = false;
    Score.playing = false;
    Play.viewBoard = null; Play.strokes.length = 0; Play.hidden.clear(); Play.inkDirty = true;
    if (this._oops++ < 2) { try { toast({ icon: '误', title: T('oops'), text: escHtml(String(err && err.message ? err.message : err)).slice(0, 120), ms: 5000 }); } catch (e) { /* ignore */ } }
  },
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot());
else App.boot();

})();
</script>
