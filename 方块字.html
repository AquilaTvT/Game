<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="author" content="藤野京">
<meta name="description" content="方块字——落墨成笔，积笔成字。一款以书法为题的方块肉鸽，作者藤野京。">
<meta name="theme-color" content="#0c0c0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>方块字</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='9' fill='%23c0321f'/%3E%3Cg stroke='%23f8eed6' stroke-width='6' stroke-linecap='round'%3E%3Cpath d='M16 20h32M16 32h32M16 44h32M32 20v24'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --ink: #1b1918; --paper: #f3ead3; --paper2: #e7dabb; --paper3: #d6c59e;
  --red: #c0321f; --red2: #8f2015; --red3: #e2573f;
  --gold: #d2a84a; --gold2: #f3d98b; --gold3: #8a6316;
  --blue: #3f8fd0; --blue2: #1f5c8f; --jade: #46a07c;
  --txt: #efe6d2; --dim: #a59c8a; --dim2: #7b7366;
  --line: rgba(210, 168, 74, 0.3); --line2: rgba(210, 168, 74, 0.55);
  --panel: linear-gradient(180deg, rgba(36, 33, 35, 0.95), rgba(19, 18, 21, 0.96));
  --c-form: #3f8fd0; --c-spirit: #e0503c;
  --f-kai: "STKaiti", "KaiTi", "Kaiti SC", "BiauKai", "AR PL UKai CN", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --f-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Zen Hei", "Segoe UI", system-ui, sans-serif;
  --f-num: "Georgia", "Times New Roman", "Songti SC", serif;
  --W: 1280px; --H: 720px; --s: 1;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0e; color: var(--txt);
  font-family: var(--f-ui); font-size: 20px; line-height: 1.35;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
body.nogl { background: radial-gradient(120% 90% at 30% 20%, #2a2620 0%, #131316 55%, #08080a 100%); }
body.nogl #bg { display: none; }
#bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#fx { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 60; }
#stage {
  position: fixed; left: var(--cx, 50%); top: var(--cy, 50%); width: var(--W); height: var(--H); z-index: 10;
  transform: translate(calc(-50% + var(--shx, 0px)), calc(-50% + var(--shy, 0px))) scale(var(--s));
  transform-origin: 50% 50%;
}
.screen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; }
.screen.on { display: block; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
button:disabled { cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
canvas { display: block; }
.kai { font-family: var(--f-kai); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.hide { display: none !important; }
.scroll { overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(210, 168, 74, 0.45) transparent; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(210, 168, 74, 0.4); border-radius: 4px; }

/* ---------- rich text ---------- */
.rk { font-weight: 700; white-space: nowrap; }
.rk-c { color: #7fbdf0; } .rk-m { color: #ff8a73; } .rk-g { color: var(--gold2); } .rk-k { color: #fff3d6; }
.rk-x { color: #fff; background: #c8402e; border-radius: 5px; padding: 0 5px; }
.rk-mo { color: #d9d2c4; } .rk-zhu { color: #ff7a61; } .rk-qing { color: #74b6ee; } .rk-jin { color: var(--gold2); }
.rk-n { font-weight: 400; color: var(--dim); font-size: 0.86em; white-space: normal; font-style: normal; }
.onpaper .rk-c { color: #1f5c8f; } .onpaper .rk-m { color: #b3261a; } .onpaper .rk-g { color: #8a6316; } .onpaper .rk-k { color: #2a1a10; }
.onpaper .rk-mo { color: #1b1918; } .onpaper .rk-zhu { color: #b3261a; } .onpaper .rk-qing { color: #1f5c8f; } .onpaper .rk-jin { color: #8a6316; }
.onpaper .rk-n { color: #7a6a52; }

/* ---------- panels and buttons ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 8px 22px; border-radius: 10px;
  font-family: var(--f-kai); font-size: 26px; font-weight: 700; letter-spacing: 0.06em; color: var(--txt);
  background: linear-gradient(180deg, #3a3538, #242125); border: 1px solid var(--line2);
  box-shadow: 0 4px 0 #0c0b0d, 0 8px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: transform 0.08s, filter 0.12s, box-shadow 0.08s; position: relative; white-space: nowrap;
}
.btn:hover:not(:disabled) { filter: brightness(1.18); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #0c0b0d, 0 3px 8px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
.btn:disabled { filter: grayscale(0.85) brightness(0.62); }
.btn.red { background: linear-gradient(180deg, #d2452f, #9c2416); border-color: #f0b98a; color: #fff6e6; text-shadow: 0 2px 0 rgba(90, 14, 6, 0.8); }
.btn.gold { background: linear-gradient(180deg, #e2bd62, #b48a2c); border-color: #fbe9b4; color: #2a1c06; text-shadow: 0 1px 0 rgba(255, 245, 210, 0.5); }
.btn.blue { background: linear-gradient(180deg, #3c7fb8, #235581); border-color: #a8d2f3; color: #f2f8ff; text-shadow: 0 2px 0 rgba(10, 40, 70, 0.8); }
.btn.jade { background: linear-gradient(180deg, #4aa582, #2a6f55); border-color: #b6ecd4; color: #f1fff8; text-shadow: 0 2px 0 rgba(8, 50, 34, 0.8); }
.btn.small { min-height: 42px; padding: 4px 14px; font-size: 21px; border-radius: 8px; }
.btn.tiny { min-height: 34px; padding: 2px 10px; font-size: 18px; border-radius: 7px; letter-spacing: 0; }
.btn.ghost { background: rgba(255, 255, 255, 0.04); box-shadow: none; border-color: var(--line); font-weight: 400; }
.btn .sub { font-family: var(--f-num); font-size: 0.72em; opacity: 0.9; font-weight: 700; letter-spacing: 0; }
.iconbtn { width: 52px; height: 52px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-kai); font-size: 26px; font-weight: 700; color: var(--gold2); background: linear-gradient(180deg, #37323a, #201e23); border: 1px solid var(--line2); box-shadow: 0 3px 0 #0c0b0d, inset 0 1px 0 rgba(255, 255, 255, 0.1); transition: transform 0.08s, filter 0.12s; }
.iconbtn:hover { filter: brightness(1.25); }
.iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0c0b0d; }
.coin { display: inline-block; width: 0.82em; height: 0.82em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe9a6, #d2a84a 55%, #8a6316); box-shadow: inset 0 0 0 0.09em rgba(120, 80, 10, 0.55); position: relative; vertical-align: -0.08em; margin-right: 0.18em; }
.coin::after { content: ""; position: absolute; left: 32%; top: 32%; width: 36%; height: 36%; background: #6b4a0c; opacity: 0.75; }

/* ---------- game layout ---------- */
#game.on { display: grid; }
body[data-o="l"] #game { grid-template-columns: 316px minmax(0, 1fr) 256px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top center side" "res center side"; padding: 10px 12px; column-gap: 10px; row-gap: 10px; }
body[data-o="p"] #game { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "top" "side" "center" "res"; padding: 10px 10px 12px; row-gap: 8px; }
#hudtop { grid-area: top; display: flex; gap: 10px; min-width: 0; }
body[data-o="l"] #hudtop { flex-direction: column; }
body[data-o="p"] #hudtop { flex-direction: row; flex-wrap: wrap; }
#side { grid-area: side; display: flex; min-width: 0; min-height: 0; }
#center { grid-area: center; position: relative; min-width: 0; min-height: 0; }
#res { grid-area: res; display: flex; min-width: 0; }
body[data-o="l"] #res { flex-direction: column; gap: 8px; justify-content: flex-end; }
body[data-o="p"] #res { flex-direction: row; gap: 8px; align-items: stretch; }

/* blind card */
.blindcard { padding: 8px 14px 8px; position: relative; overflow: hidden; }
body[data-o="p"] .blindcard { flex: 0 0 292px; }
.blindcard .fa { font-family: var(--f-kai); font-size: 20px; color: var(--gold2); letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px; }
.blindcard .fa .g { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; border-radius: 6px; background: var(--red); color: #fff3dc; font-size: 21px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); flex: none; }
.blindcard .nm { font-family: var(--f-kai); font-size: 29px; font-weight: 700; line-height: 1.15; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blindcard.boss .nm { color: #ff9a82; }
.blindcard .fx { font-size: 16.5px; line-height: 1.3; color: #e8dcc6; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.blindcard .fx .rk-n { display: none; }
.blindcard.boss { border-color: rgba(224, 80, 60, 0.6); box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(190, 40, 20, 0.18); }
.blindcard .infobtn { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line2); color: var(--gold2); font-family: var(--f-num); font-style: italic; font-weight: 700; font-size: 20px; background: rgba(0, 0, 0, 0.25); }

/* score card */
.scorecard { padding: 6px 14px 9px; position: relative; }
body[data-o="p"] .scorecard { flex: 1 1 0; min-width: 0; }
.scorecard .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.scorecard .lbl { font-family: var(--f-kai); font-size: 19px; color: var(--dim); letter-spacing: 0.1em; white-space: nowrap; }
.scorecard .tgt { font-family: var(--f-num); font-size: 25px; font-weight: 700; color: var(--gold2); font-variant-numeric: tabular-nums; }
.scorecard .cur { font-family: var(--f-num); font-size: 40px; font-weight: 700; line-height: 1.05; color: #fff8e8; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); white-space: nowrap; }
.scorecard .bar { height: 9px; border-radius: 5px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 6px; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6); }
.scorecard .bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, #b9892a, #f3d98b); transition: width 0.5s cubic-bezier(0.2, 0.9, 0.2, 1); }
.scorecard.done .bar i { background: linear-gradient(90deg, #e0503c, #ffd27a); box-shadow: 0 0 12px rgba(255, 170, 80, 0.8); }
.scorecard.done .cur { color: #ffd98a; text-shadow: 0 0 18px rgba(255, 150, 60, 0.75), 0 2px 0 rgba(0, 0, 0, 0.5); }

/* character card */
.charcard { padding: 8px 12px; display: flex; flex-direction: column; gap: 7px; }
body[data-o="p"] .charcard { flex: 1 1 100%; flex-direction: row; align-items: center; gap: 12px; padding: 8px 12px; }
.charcard .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
body[data-o="p"] .charcard .who { flex: 0 0 286px; }
.charcard .glyph { width: 70px; height: 70px; flex: none; border-radius: 8px; background: linear-gradient(135deg, #f8f1de, #e2d3b2); box-shadow: inset 0 0 0 1px rgba(160, 44, 32, 0.5), 0 3px 8px rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.charcard .glyph canvas { width: 58px; height: 58px; }
.charcard .glyph.flip { animation: glyphflip 0.34s cubic-bezier(0.2, 1.5, 0.4, 1); }
@keyframes glyphflip { 0% { transform: scale(0.72) rotate(-8deg); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
.charcard .glyph.empty::after { content: ""; position: absolute; inset: 9px; border: 2px dashed rgba(160, 44, 32, 0.3); border-radius: 4px; }
.charcard .meta { min-width: 0; flex: 1; }
.charcard .cname { font-family: var(--f-kai); font-size: 31px; font-weight: 700; line-height: 1.1; white-space: nowrap; display: flex; align-items: baseline; gap: 8px; }
.charcard .cname small { font-family: var(--f-ui); font-size: 16px; font-weight: 400; color: var(--dim); }
.charcard .cname .xb { font-family: var(--f-num); font-size: 21px; color: #fff; background: #c8402e; padding: 0 7px; border-radius: 6px; font-weight: 700; }
.charcard .csub { font-size: 16.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.charcard .csub b { color: var(--gold2); font-weight: 600; }
.charcard .csub.warn { color: #ff8a73; }
.calc { display: flex; align-items: center; gap: 8px; }
body[data-o="p"] .calc { flex: 1 1 0; min-width: 0; }
.calc .box { flex: 1 1 0; min-width: 0; border-radius: 9px; padding: 3px 10px 5px; text-align: right; position: relative; box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.35), 0 1px 0 rgba(255, 255, 255, 0.08); overflow: hidden; }
.calc .box.form { background: linear-gradient(180deg, #3f8fd0, #235b8c); }
.calc .box.spirit { background: linear-gradient(180deg, #e0503c, #9c2416); }
.calc .box .t { position: absolute; left: 9px; top: 3px; font-family: var(--f-kai); font-size: 18px; color: rgba(255, 255, 255, 0.85); }
.calc .box .v { font-family: var(--f-num); font-size: 31px; font-weight: 700; color: #fff; line-height: 1.15; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); white-space: nowrap; display: block; padding-top: 12px; }
.calc .times { font-family: var(--f-num); font-size: 30px; color: var(--gold2); font-weight: 700; flex: none; }
.calc .box.bump { animation: bump 0.22s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); filter: brightness(1.5); } 100% { transform: scale(1); } }
.hints { display: flex; gap: 6px; align-items: center; min-height: 42px; }
body[data-o="p"] .hints { flex: 0 0 auto; }
.hints .hl { font-size: 15px; color: var(--dim2); writing-mode: vertical-rl; letter-spacing: 0.1em; font-family: var(--f-kai); }
.hint { display: flex; align-items: center; gap: 5px; padding: 3px 7px 3px 4px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); }
.hint canvas { width: 34px; height: 34px; background: #efe5cc; border-radius: 4px; }
.hint span { font-family: var(--f-num); font-size: 16px; color: var(--gold2); font-weight: 700; }

/* resources */
.inkcard { padding: 6px 12px 9px; }
body[data-o="p"] .inkcard { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.inkcard .row { display: flex; align-items: baseline; justify-content: space-between; }
.inkcard .lbl { font-family: var(--f-kai); font-size: 21px; color: var(--txt); letter-spacing: 0.1em; }
.inkcard .val { font-family: var(--f-num); font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; }
.inkcard .val small { font-size: 17px; color: var(--dim); font-weight: 400; }
.inkbar { height: 16px; border-radius: 8px; background: #0c0b0d; margin-top: 5px; position: relative; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.07); }
.inkbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 8px; background: linear-gradient(180deg, #5a5650, #25221f 55%, #141211); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28); transition: width 0.3s cubic-bezier(0.2, 0.9, 0.2, 1); }
.inkbar b { position: absolute; top: 0; bottom: 0; background: rgba(255, 120, 90, 0.75); border-radius: 0 8px 8px 0; transition: opacity 0.2s; }
.inkcard.low .val { color: #ff8a73; }
.counters { display: flex; gap: 8px; }
body[data-o="p"] .counters { flex: 0 0 auto; }
.counter { flex: 1 1 0; padding: 5px 12px; min-width: 78px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
body[data-o="p"] .counter { flex-direction: column; justify-content: center; gap: 0; }
.counter .lbl { font-family: var(--f-kai); font-size: 18px; color: var(--dim); letter-spacing: 0.08em; white-space: nowrap; }
.counter .val { font-family: var(--f-num); font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.counter.ig .val { color: #ff8a73; } .counter.dc .val { color: #7fbdf0; } .counter.mn .val { color: var(--gold2); }
.counter.zero .val { color: var(--dim2); }
.resbtns { display: flex; gap: 8px; justify-content: space-between; }
body[data-o="p"] .resbtns { flex: 0 0 auto; align-items: center; gap: 6px; }
body[data-o="l"] .resbtns .iconbtn { flex: 1; }
.runline { font-size: 16px; color: var(--dim); display: flex; justify-content: space-between; padding: 0 4px; white-space: nowrap; }
body[data-o="p"] .runline { display: none; }

/* seals and items */
#side { gap: 8px; }
body[data-o="l"] #side { flex-direction: column; }
body[data-o="p"] #side { flex-direction: row; align-items: stretch; }
.sealbox { padding: 8px; display: flex; gap: 6px; min-height: 0; min-width: 0; position: relative; }
body[data-o="l"] .sealbox { flex-direction: column; flex: 1 1 auto; }
body[data-o="p"] .sealbox { flex-direction: row; flex: 1 1 auto; align-items: center; }
.boxtitle { font-family: var(--f-kai); font-size: 17px; color: var(--dim); letter-spacing: 0.12em; display: flex; justify-content: space-between; padding: 0 2px; flex: none; }
body[data-o="p"] .boxtitle { flex-direction: column; letter-spacing: 0; padding: 0 2px 0 0; gap: 2px; align-items: center; justify-content: center; font-size: 17px; line-height: 1.1; }
body[data-o="p"] .boxtitle .num { font-size: 14px; }
.seallist { display: flex; gap: 6px; min-height: 0; min-width: 0; flex: 1 1 auto; }
body[data-o="l"] .seallist { flex-direction: column; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
body[data-o="l"] .seallist::-webkit-scrollbar { display: none; }
body[data-o="p"] .seallist { flex-direction: row; align-items: center; }
.seal { display: flex; align-items: center; gap: 10px; border-radius: 9px; padding: 4px 6px; cursor: pointer; position: relative; min-width: 0; border: 1px solid transparent; transition: background 0.12s, transform 0.12s; touch-action: none; }
body[data-o="l"] .seal { flex: 0 0 auto; min-height: 70px; }
.seal:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.08); }
.seal .sealface { flex: none; width: 62px; height: 62px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.5)); }
body[data-o="p"] .seal { padding: 2px; }
body[data-o="p"] .seal .sealface { width: var(--ss, 74px); height: var(--ss, 74px); }
body[data-o="p"] .seal .st { display: none; }
.seal .st { min-width: 0; flex: 1; }
.seal .st .n { font-family: var(--f-kai); font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.seal .st .d { font-size: 14px; color: var(--dim); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seal .st .d .rk-n { display: none; }
.seal.off { filter: grayscale(1) brightness(0.55); }
.seal.off::after { content: "封"; position: absolute; left: 22px; top: 18px; font-family: var(--f-kai); font-size: 30px; color: #ff8a73; text-shadow: 0 0 6px #000; }
.seal.pop .sealface { animation: sealpop 0.32s cubic-bezier(0.2, 1.7, 0.4, 1); }

.itembox { padding: 8px; display: flex; gap: 6px; min-width: 0; }

.itemlist { display: flex; gap: 6px; flex-wrap: wrap; }
.item { width: 72px; height: 88px; border-radius: 7px; cursor: pointer; position: relative; flex: none; transition: transform 0.12s; }

.item.empty:hover { transform: none; }
.slip { width: 100%; height: 100%; border-radius: 7px; background: linear-gradient(160deg, #f8f1de, #e1d1ad); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(120, 90, 40, 0.35); color: #2a1a10; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.slip.tie { background: linear-gradient(160deg, #26384a, #131c26); color: #f0e6cf; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(160, 200, 240, 0.35); }
.slip .gl { font-family: var(--f-kai); font-size: 30px; font-weight: 700; line-height: 1; }
.slip .nm { font-family: var(--f-kai); font-size: 14px; line-height: 1.1; margin-top: 4px; text-align: center; padding: 0 2px; max-width: 100%; white-space: nowrap; overflow: hidden; }

/* ---------- playfield ---------- */
#play { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }

#trayrow { flex: 0 0 150px; display: flex; align-items: center; gap: 10px; padding: 0 6px 4px; }

#trayanchor { position: absolute; pointer-events: none; }
#trayrow .actbtn { pointer-events: auto; flex: none; width: 118px; height: 118px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; transition: transform 0.08s, filter 0.12s, box-shadow 0.1s; }

#trayrow .actbtn .k { position: absolute; right: 7px; top: 5px; font-family: var(--f-num); font-size: 13px; opacity: 0.6; }
#btn-ignite { background: radial-gradient(circle at 50% 30%, #e85b40, #a0271a 70%); border: 2px solid #f6c39a; color: #fff6e6; text-shadow: 0 2px 0 rgba(90, 14, 6, 0.8); box-shadow: 0 6px 0 #5c130b, 0 12px 22px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.25); }
#btn-ignite:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #5c130b, 0 4px 8px rgba(0, 0, 0, 0.5); }
#btn-ignite.ready { animation: ready 1.3s ease-in-out infinite; }
@keyframes ready { 0%, 100% { box-shadow: 0 6px 0 #5c130b, 0 12px 22px rgba(0, 0, 0, 0.5), 0 0 0 0 rgba(255, 190, 120, 0.7), inset 0 2px 0 rgba(255, 255, 255, 0.25); } 50% { box-shadow: 0 6px 0 #5c130b, 0 12px 22px rgba(0, 0, 0, 0.5), 0 0 26px 7px rgba(255, 170, 90, 0.55), inset 0 2px 0 rgba(255, 255, 255, 0.25); } }
#btn-ignite:disabled { filter: grayscale(0.9) brightness(0.55); }
#btn-rinse { background: radial-gradient(circle at 50% 30%, #4d8fc4, #1f4f7c 70%); border: 2px solid #a8d2f3; color: #f2f8ff; text-shadow: 0 2px 0 rgba(10, 40, 70, 0.8); box-shadow: 0 6px 0 #0f2c47, 0 12px 22px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.25); }
#btn-rinse:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #0f2c47, 0 4px 8px rgba(0, 0, 0, 0.5); }
#btn-rinse:disabled { filter: grayscale(0.9) brightness(0.55); }
#btn-rinse.target { animation: target 0.7s ease-in-out infinite; }
#btn-rinse.armed { filter: brightness(1.35); box-shadow: 0 6px 0 #0f2c47, 0 0 0 4px rgba(168, 210, 243, 0.9), 0 0 30px rgba(120, 190, 255, 0.8); }
@keyframes target { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.stuckbar { position: absolute; left: 50%; bottom: 158px; transform: translateX(-50%); pointer-events: auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; z-index: 5; white-space: nowrap; border-color: rgba(224, 80, 60, 0.7); animation: rise 0.3s both; }
.stuckbar span { font-family: var(--f-kai); font-size: 22px; color: #ffb7a6; }
.bossline { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); pointer-events: none; font-family: var(--f-kai); font-size: 17px; color: #ffb7a6; background: rgba(60, 12, 8, 0.72); border: 1px solid rgba(224, 80, 60, 0.5); padding: 1px 12px; border-radius: 0 0 9px 9px; white-space: nowrap; max-width: 96%; overflow: hidden; text-overflow: ellipsis; z-index: 3; }
.bossline .rk-n { display: none; }
.peekbox { position: absolute; right: 4px; top: 8px; pointer-events: none; padding: 5px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 3; }
.peekbox .t { font-family: var(--f-kai); font-size: 14px; color: var(--dim); }
.peekbox canvas { display: block; }

/* views that take over the centre */
.view { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 8px 6px; z-index: 6; }
.view.on { display: flex; animation: viewin 0.28s cubic-bezier(0.2, 0.9, 0.2, 1) both; }
@keyframes viewin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
.vtitle { font-family: var(--f-kai); font-size: 42px; font-weight: 700; letter-spacing: 0.2em; color: var(--gold2); text-shadow: 0 3px 0 rgba(0, 0, 0, 0.5); margin-bottom: 4px; text-align: center; padding-left: 0.2em; }
.vsub { font-size: 18px; color: var(--dim); margin-bottom: 14px; text-align: center; }

/* pick a sheet */
.sheets { display: flex; gap: 12px; align-items: stretch; justify-content: center; width: 100%; }
body[data-o="p"] .sheets { flex-direction: column; align-items: center; gap: 10px; }
.sheet { flex: 1 1 0; max-width: 236px; padding: 12px 12px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; position: relative; transition: transform 0.15s, filter 0.15s; }
body[data-o="p"] .sheet { max-width: none; width: 100%; flex: none; flex-direction: row; text-align: left; gap: 14px; padding: 12px 16px; }
body[data-o="p"] .sheet .col { flex: 1; min-width: 0; }
body[data-o="p"] .sheet .acts { flex: none; width: 190px; }
.sheet .bn { font-family: var(--f-kai); font-size: 30px; font-weight: 700; letter-spacing: 0.1em; }
.sheet .bt { font-family: var(--f-kai); font-size: 23px; color: #ff9a82; font-weight: 700; line-height: 1.2; }

.sheet .tl { font-size: 15px; color: var(--dim); letter-spacing: 0.1em; }
.sheet .rw { font-size: 17px; color: var(--txt); }
.sheet .fx { font-size: 16.5px; line-height: 1.32; color: #f0e2cc; min-height: 44px; }
.sheet .acts { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: auto; }

.sheet .skip { font-size: 15px; color: var(--dim); line-height: 1.25; }

.sheet.later { filter: brightness(0.72); }
.sheet.now { border-color: var(--gold2); transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(243, 217, 139, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08); }

.sheet .stamp { position: absolute; right: 8px; top: 8px; font-family: var(--f-kai); font-size: 19px; color: #9fe0bf; border: 2px solid #9fe0bf; border-radius: 6px; padding: 0 6px; transform: rotate(8deg); }
.pickinfo { margin-top: 14px; font-size: 17px; color: var(--dim); text-align: center; line-height: 1.5; }
.pickinfo b { color: var(--gold2); font-weight: 600; }

/* cash out */
.cashcard { width: min(100%, 520px); padding: 18px 26px 20px; }
.cashcard .hd { font-family: var(--f-kai); font-size: 38px; font-weight: 700; color: var(--gold2); text-align: center; letter-spacing: 0.25em; padding-left: 0.25em; }
.cashcard .sc { text-align: center; font-size: 18px; color: var(--dim); margin: 2px 0 12px; }

.cashline { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed rgba(210, 168, 74, 0.2); font-size: 21px; opacity: 0; transform: translateX(-12px); transition: opacity 0.25s, transform 0.25s; }
.cashline.in { opacity: 1; transform: none; }
.cashline .v { font-family: var(--f-num); font-size: 25px; font-weight: 700; color: var(--gold2); }

/* shop */
.shop { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 8px; min-height: 0; }

.shelf { padding: 8px 10px 10px; flex: none; }
.shelf .lab { font-family: var(--f-kai); font-size: 17px; color: var(--dim); letter-spacing: 0.15em; margin-bottom: 6px; display: flex; justify-content: space-between; }
.goods { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.shopscroll { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.good { width: 152px; border-radius: 10px; position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.14s; padding-bottom: 4px; }
.good:hover { transform: translateY(-5px); }
.good.sold { visibility: hidden; }
.good .body { width: 100%; height: 148px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; overflow: hidden; }
.good.gseal .body { background: linear-gradient(160deg, rgba(60, 54, 50, 0.9), rgba(30, 27, 28, 0.95)); border: 1px solid var(--line2); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
.good.gseal .body .sealface { width: 84px; height: 84px; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.55)); }
.good .gn { font-family: var(--f-kai); font-size: 19px; font-weight: 700; text-align: center; line-height: 1.15; white-space: nowrap; max-width: 146px; overflow: hidden; text-overflow: ellipsis; }

.price { margin-top: 6px; font-family: var(--f-num); font-size: 23px; font-weight: 700; color: var(--gold2); background: rgba(0, 0, 0, 0.5); border: 1px solid var(--line2); border-radius: 14px; padding: 0 12px 1px; white-space: nowrap; }
.price.cant { color: #ff8a73; border-color: rgba(224, 80, 60, 0.6); }
.price.free { color: #9fe0bf; border-color: rgba(120, 220, 170, 0.6); font-family: var(--f-kai); }
.packart { width: 112px; height: 136px; border-radius: 9px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.18), inset 0 0 0 5px rgba(0, 0, 0, 0.18); overflow: hidden; }
.packart .pg { font-family: var(--f-kai); font-size: 50px; font-weight: 700; line-height: 1; color: rgba(255, 246, 225, 0.95); text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }

.packart.k-wen { background: linear-gradient(150deg, #3c8a6c, #1b4a39); }
.packart.k-mo { background: linear-gradient(150deg, #4a4540, #1c1a19); }
.packart::after { content: ""; position: absolute; left: -60%; top: 0; width: 50%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent); transform: skewX(-18deg); animation: sheen 4.5s ease-in-out infinite; }
@keyframes sheen { 0%, 70% { left: -60%; } 100% { left: 130%; } }
.vouch { width: 112px; height: 136px; border-radius: 9px; background: linear-gradient(150deg, #7a5a1e, #3a2a0c); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 236, 170, 0.5), inset 0 0 0 5px rgba(0, 0, 0, 0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; text-align: center; }
.vouch .pg { font-family: var(--f-kai); font-size: 44px; line-height: 1; color: var(--gold2); font-weight: 700; }
.vouch .pn { font-family: var(--f-kai); font-size: 17px; color: #fff3d6; line-height: 1.1; }

/* ---------- pop-over card and tooltip ---------- */
#tip, #pop { position: absolute; left: 0; top: 0; z-index: 40; display: none; }
#tip { pointer-events: none; z-index: 45; }
.card { width: 330px; border-radius: 10px; padding: 12px 14px 12px; background: linear-gradient(170deg, #f9f2df, #e6d7b4); color: #2a1a10; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(120, 90, 40, 0.4); font-size: 18.5px; line-height: 1.42; position: relative; animation: cardin 0.14s ease-out both; }
@keyframes cardin { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: none; } }
.card .ch { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.card .cn { font-family: var(--f-kai); font-size: 26px; font-weight: 700; line-height: 1.15; }

/* ---------- modals ---------- */

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { max-width: 100%; max-height: 100%; display: flex; flex-direction: column; min-height: 0; animation: modalin 0.24s cubic-bezier(0.2, 1.2, 0.3, 1) both; position: relative; }
@keyframes modalin { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: none; } }
.modal .mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 10px 20px; border-bottom: 1px solid var(--line); flex: none; }

.xbtn { width: 44px; height: 44px; border-radius: 50%; font-size: 26px; line-height: 1; color: var(--dim); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); flex: none; display: inline-flex; align-items: center; justify-content: center; }

.tabs { display: flex; gap: 6px; padding: 8px 14px 0; flex: none; flex-wrap: wrap; }
.tab { font-family: var(--f-kai); font-size: 22px; padding: 6px 16px; border-radius: 9px 9px 0 0; color: var(--dim); background: rgba(255, 255, 255, 0.03); border: 1px solid transparent; border-bottom: 0; white-space: nowrap; }

/* dictionary */

.dch { border-radius: 10px; padding: 8px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; position: relative; transition: transform 0.12s, border-color 0.12s; }

.dsec { font-family: var(--f-kai); font-size: 23px; color: var(--gold2); margin: 14px 0 8px; letter-spacing: 0.1em; display: flex; align-items: baseline; gap: 10px; }
.dsec:first-child { margin-top: 0; }

.chardetail { display: flex; gap: 18px; align-items: flex-start; }
.chardetail canvas { width: 150px; height: 150px; flex: none; background: linear-gradient(135deg, #f8f1de, #e2d3b2); border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(160, 44, 32, 0.45), 0 6px 14px rgba(0, 0, 0, 0.4); }
.chardetail .big { font-family: var(--f-kai); font-size: 54px; font-weight: 700; line-height: 1; }
.chardetail .py { font-size: 19px; color: var(--dim); margin-left: 10px; }
.chardetail .gl { font-family: var(--f-kai); font-size: 20px; color: #e8dcc6; margin: 8px 0; line-height: 1.5; }
.chardetail .ln { font-size: 18px; margin: 4px 0; }

/* tier table */
.tiertab { width: 100%; border-collapse: collapse; font-size: 19px; }
.tiertab th { font-family: var(--f-kai); font-weight: 400; color: var(--dim); font-size: 17px; text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--line); }
.tiertab th:first-child, .tiertab td:first-child { text-align: left; }
.tiertab td { padding: 7px 10px; text-align: right; border-bottom: 1px dashed rgba(255, 255, 255, 0.07); font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.tiertab td:first-child { font-family: var(--f-kai); font-size: 22px; }
.tiertab .cf { color: #7fbdf0; font-weight: 700; } .tiertab .cs { color: #ff8a73; font-weight: 700; } .tiertab .lv { color: var(--gold2); font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 19px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; font-family: var(--f-num); font-weight: 700; }

/* ink box (deck) */
.deckgrid { display: flex; flex-wrap: wrap; gap: 8px; }
.pc { width: 92px; height: 92px; border-radius: 9px; background: linear-gradient(135deg, #f8f1de, #e2d3b2); box-shadow: inset 0 0 0 1px rgba(160, 44, 32, 0.35), 0 3px 8px rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; flex: none; }
.pc:hover { transform: translateY(-2px); }
.pc.sel { box-shadow: 0 0 0 3px var(--gold2), 0 0 18px rgba(243, 217, 139, 0.7), 0 3px 8px rgba(0, 0, 0, 0.4); transform: translateY(-4px); }
.pc.gone { opacity: 0.32; }
.pc .tg { position: absolute; left: 4px; top: 2px; font-family: var(--f-kai); font-size: 14px; color: #7a2a1e; font-weight: 700; }
.pc .cnt { position: absolute; right: 5px; bottom: 2px; font-family: var(--f-num); font-size: 14px; color: #5d4a34; }
.inkrow { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; font-size: 17px; color: var(--dim); align-items: center; }
.inkrow b { font-family: var(--f-num); color: var(--txt); }
.inkdot { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.45); }

/* paper picker */
.paperpick { display: grid; gap: 4px; margin: 0 auto; background: #f1e7cf; padding: 10px; border-radius: 8px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5); }
.paperpick button { background: rgba(168, 52, 38, 0.06); border: 1px solid rgba(168, 52, 38, 0.45); border-radius: 3px; position: relative; color: #2a1a10; font-family: var(--f-kai); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.paperpick button:hover { background: rgba(210, 168, 74, 0.5); }
.paperpick button.has { box-shadow: inset 0 0 0 3px var(--sq, #888); }
.paperpick button.ink { background: #2a2623; color: #efe6d2; }
.paperpick button.ink.zhu { background: #c0321f; } .paperpick button.ink.qing { background: #1f5c8f; } .paperpick button.ink.jin { background: #c79a36; color: #2a1a10; } .paperpick button.ink.stone { background: #7d766a; }
.paperpick button.sel { outline: 3px solid var(--gold2); outline-offset: 1px; z-index: 2; }
.paperpick button:disabled { opacity: 0.35; }

/* collection lists */
.sealgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px 8px; }
.sg { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-align: center; }
.sg .sealface { width: 72px; height: 72px; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5)); transition: transform 0.12s; }
.sg:hover .sealface { transform: scale(1.08) rotate(-3deg); }
.sg .n { font-family: var(--f-kai); font-size: 16px; line-height: 1.1; }
.sg.unseen .sealface { filter: grayscale(1) brightness(0.35) blur(1.5px); }
.sg.unseen .n { color: var(--dim2); }
.sg.locked .sealface { filter: grayscale(1) brightness(0.2); }
.achlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.ach { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.07); }
.ach .ic { width: 46px; height: 46px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--f-kai); font-size: 26px; font-weight: 700; background: #2a2729; color: var(--dim2); border: 1px solid rgba(255, 255, 255, 0.1); }
.ach.got .ic { background: var(--red); color: #fff3dc; border-color: #f0b98a; box-shadow: 0 0 12px rgba(224, 80, 60, 0.5); }
.ach .an { font-family: var(--f-kai); font-size: 21px; font-weight: 700; line-height: 1.15; }
.ach .ad { font-size: 15.5px; color: var(--dim); line-height: 1.25; }
.ach:not(.got) .an { color: var(--dim); }
.bosslist { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.bl { padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.07); }
.bl .bn { font-family: var(--f-kai); font-size: 22px; font-weight: 700; color: #ff9a82; display: flex; justify-content: space-between; align-items: baseline; }
.bl .bn small { font-family: var(--f-num); font-size: 15px; color: var(--jade); }
.bl .ba { font-size: 14px; color: var(--dim); }
.bl .bd { font-size: 16px; line-height: 1.3; margin-top: 3px; }
.bl.unk { opacity: 0.5; }

/* settings */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.08); font-size: 21px; }
.setrow .sl { font-family: var(--f-kai); }
.setrow .sl small { display: block; font-family: var(--f-ui); font-size: 14.5px; color: var(--dim); }
.seg { display: inline-flex; border-radius: 9px; overflow: hidden; border: 1px solid var(--line2); flex: none; }
.seg button { padding: 6px 15px; font-size: 19px; color: var(--dim); background: rgba(0, 0, 0, 0.25); min-width: 54px; }
.seg button.on { background: var(--gold); color: #2a1c06; font-weight: 700; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 220px; height: 30px; background: transparent; touch-action: pan-x; flex: none; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--gold) var(--p, 50%), rgba(255, 255, 255, 0.12) var(--p, 50%)); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); }
input[type="range"]::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--gold); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c9, #d2a84a); border: 2px solid #3a2a0c; margin-top: -9px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c9, #d2a84a); border: 2px solid #3a2a0c; }
textarea.code { width: 100%; height: 110px; background: #0c0b0d; color: var(--txt); border: 1px solid var(--line); border-radius: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; padding: 8px; resize: none; -webkit-user-select: text; user-select: text; touch-action: auto; }
input.txt { background: #0c0b0d; color: var(--txt); border: 1px solid var(--line2); border-radius: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 22px; padding: 6px 12px; width: 220px; text-transform: uppercase; -webkit-user-select: text; user-select: text; touch-action: auto; letter-spacing: 0.1em; }

/* help */
.help h3 { font-family: var(--f-kai); font-size: 26px; color: var(--gold2); margin: 16px 0 6px; letter-spacing: 0.1em; }
.help h3:first-child { margin-top: 0; }
.help p { margin: 6px 0; font-size: 19.5px; line-height: 1.55; color: #e8dcc6; }
.help .ex { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0; }
.help .ex div { text-align: center; font-size: 16px; color: var(--dim); }
.help .ex canvas { width: 70px; height: 70px; background: linear-gradient(135deg, #f8f1de, #e2d3b2); border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(160, 44, 32, 0.45); display: block; margin: 0 auto 3px; }
.help ul { margin: 6px 0; padding-left: 26px; font-size: 19px; line-height: 1.55; color: #e8dcc6; }

/* ---------- toasts ---------- */
#toasts { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 48; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: 92%; }
.toast { padding: 9px 20px 9px 12px; border-radius: 26px; display: flex; align-items: center; gap: 12px; background: linear-gradient(180deg, rgba(46, 40, 34, 0.97), rgba(22, 20, 20, 0.97)); border: 1px solid var(--gold); box-shadow: 0 8px 26px rgba(0, 0, 0, 0.65), 0 0 22px rgba(210, 168, 74, 0.25); animation: toastin 0.4s cubic-bezier(0.2, 1.3, 0.3, 1) both; max-width: 100%; }
.toast.out { animation: toastout 0.35s ease-in both; }
@keyframes toastin { from { opacity: 0; transform: translateY(-26px) scale(0.92); } to { opacity: 1; transform: none; } }
@keyframes toastout { to { opacity: 0; transform: translateY(-18px); } }
.toast .ti { width: 44px; height: 44px; border-radius: 50%; background: var(--red); color: #fff3dc; font-family: var(--f-kai); font-size: 25px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.25); overflow: hidden; }
.toast .ti canvas { width: 34px; height: 34px; }
.toast .ti.paper { background: linear-gradient(135deg, #f8f1de, #e2d3b2); }
.toast .tt { font-family: var(--f-kai); font-size: 21px; font-weight: 700; color: var(--gold2); line-height: 1.15; }
.toast .td { font-size: 16px; color: #e8dcc6; line-height: 1.25; }

/* ---------- menu / title ---------- */
#menu { overflow: hidden; }
.title { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; }
body[data-o="l"] .title { flex-direction: row; gap: 70px; }
.logo { position: relative; display: flex; flex-direction: column; align-items: center; }
.logo canvas { display: block; }
.logo .sub { font-family: var(--f-num); font-size: 22px; letter-spacing: 0.62em; color: var(--gold2); margin-top: 10px; padding-left: 0.62em; opacity: 0.9; text-transform: uppercase; }
.logo .tag { font-family: var(--f-kai); font-size: 24px; color: #d9cdb6; letter-spacing: 0.5em; margin-top: 12px; padding-left: 0.5em; }
.menulist { display: flex; flex-direction: column; gap: 12px; width: 330px; }
body[data-o="p"] .menulist { width: 430px; gap: 14px; }
body[data-o="p"] .menulist .btn { min-height: 72px; font-size: 34px; }
body[data-o="p"] .menulist .rowbtns .btn { min-height: 60px; font-size: 25px; }
.menulist .btn { width: 100%; min-height: 62px; font-size: 30px; letter-spacing: 0.24em; padding-left: calc(22px + 0.24em); }
.menulist .btn small { font-family: var(--f-ui); font-size: 14px; letter-spacing: 0; font-weight: 400; opacity: 0.85; margin-left: 4px; }
.menulist .rowbtns { display: flex; gap: 10px; }
.menulist .rowbtns .btn { flex: 1; min-height: 52px; font-size: 22px; letter-spacing: 0.1em; padding: 6px 4px; }
.credit { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 15px; color: var(--dim2); letter-spacing: 0.08em; }
.credit b { font-family: var(--f-kai); color: var(--dim); font-size: 17px; font-weight: 400; }
.authorseal { position: absolute; right: -58px; bottom: 44px; width: 84px; height: 84px; transform: rotate(-6deg); filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6)); }
body[data-o="p"] .authorseal { right: -6px; bottom: 96px; width: 72px; height: 72px; }

/* run setup */
.setup { display: flex; flex-direction: column; gap: 9px; }
.decks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
body[data-o="p"] .decks { grid-template-columns: repeat(4, 1fr); }
.deck { border-radius: 10px; padding: 5px 4px 4px; text-align: center; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.09); cursor: pointer; transition: transform 0.12s, border-color 0.12s; position: relative; min-width: 0; }
.deck:hover { transform: translateY(-2px); }
.deck .dg { font-family: var(--f-kai); font-size: 34px; font-weight: 700; line-height: 1.1; color: #f4ead2; }
.deck .dn2 { font-family: var(--f-kai); font-size: 17px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck.on { border-color: var(--gold2); background: rgba(210, 168, 74, 0.14); box-shadow: 0 0 18px rgba(210, 168, 74, 0.25); }
.deck.on .dg { color: var(--gold2); }
.deck.lock { opacity: 0.45; }
.deck.lock .dg { filter: blur(3px); }
.deck .won { position: absolute; right: 5px; top: 3px; font-family: var(--f-kai); font-size: 13px; color: #9fe0bf; }
.deckinfo { min-height: 84px; padding: 8px 14px; border-radius: 10px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); font-size: 18.5px; line-height: 1.45; }
.deckinfo .dt { font-family: var(--f-kai); font-size: 25px; font-weight: 700; color: var(--gold2); }
.stakes { display: flex; gap: 6px; flex-wrap: wrap; }
.stake { flex: 1 1 0; min-width: 70px; padding: 6px 2px; border-radius: 9px; text-align: center; font-family: var(--f-kai); font-size: 20px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.09); color: var(--txt); white-space: nowrap; }
.stake.on { border-color: var(--gold2); background: rgba(210, 168, 74, 0.16); color: var(--gold2); font-weight: 700; }
.stake:disabled { opacity: 0.32; }
.stakeinfo { font-size: 17px; color: var(--dim); min-height: 46px; line-height: 1.35; }
.stakeinfo b { color: #ff9a82; font-weight: 600; }
.seedrow { display: flex; align-items: center; gap: 12px; font-size: 19px; color: var(--dim); flex-wrap: wrap; }

/* end screens */
.endwrap { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.endwrap .big { font-family: var(--f-kai); font-size: 62px; font-weight: 700; letter-spacing: 0.24em; padding-left: 0.24em; line-height: 1.1; }
.endwrap.win .big { color: var(--gold2); text-shadow: 0 0 34px rgba(243, 217, 139, 0.6), 0 4px 0 rgba(0, 0, 0, 0.5); }
.endwrap.lose .big { color: #c9c0b0; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.5); }
.endwrap .quote { font-family: var(--f-kai); font-size: 22px; color: #d9cdb6; max-width: 620px; line-height: 1.5; }
.endstats { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 26px; margin: 6px 0; text-align: left; }
.endstats div { font-size: 17px; color: var(--dim); white-space: nowrap; }
.endstats b { display: block; font-family: var(--f-num); font-size: 26px; color: var(--txt); line-height: 1.15; }
.endseals { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.endseals .sealface { width: 56px; height: 56px; }
.yong { display: block; margin: 0 auto; }

/* case opening */
.packchoices { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; padding: 8px 0 4px; }
.pchoice { width: 164px; padding: 10px 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; animation: dealin 0.4s cubic-bezier(0.2, 1.3, 0.3, 1) both; position: relative; }
@keyframes dealin { from { opacity: 0; transform: translateY(40px) rotate(6deg) scale(0.8); } to { opacity: 1; transform: none; } }
.pchoice.taken { opacity: 0.25; pointer-events: none; }
.pchoice .sealface { width: 88px; height: 88px; }
.pchoice .slip { width: 92px; height: 116px; }
.pchoice .slip .gl { font-size: 40px; }
.pchoice .pn2 { font-family: var(--f-kai); font-size: 20px; font-weight: 700; line-height: 1.15; }
.pchoice .pd { font-size: 14.5px; color: #e0d4bd; line-height: 1.3; min-height: 56px; }
.pchoice .pd .rk-n { display: block; }
.pchoice .pcv { width: 100px; height: 100px; background: linear-gradient(135deg, #f8f1de, #e2d3b2); border-radius: 9px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(160, 44, 32, 0.35); }
.pchoice .btns { display: flex; gap: 6px; width: 100%; margin-top: auto; }
.pchoice .btns .btn { flex: 1; padding: 2px 4px; }

/* tutorial coach */
.coach { position: absolute; z-index: 28; max-width: 440px; padding: 12px 16px 12px; border-radius: 12px; background: linear-gradient(170deg, #f9f2df, #e6d7b4); color: #2a1a10; font-size: 19.5px; line-height: 1.45; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.7), 0 0 0 2px var(--gold); animation: cardin 0.25s both; pointer-events: auto; }
.coach .cstep { font-family: var(--f-kai); font-size: 15px; color: #8a6316; letter-spacing: 0.1em; }
.coach .cbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.coach b { color: #b3261a; }
.spot { position: absolute; z-index: 27; border-radius: 14px; box-shadow: 0 0 0 3px var(--gold2), 0 0 0 9999px rgba(6, 6, 9, 0.3); pointer-events: none; transition: all 0.25s; animation: spotpulse 1.4s ease-in-out infinite; }
@keyframes spotpulse { 0%, 100% { box-shadow: 0 0 0 3px var(--gold2), 0 0 0 9999px rgba(6, 6, 9, 0.3); } 50% { box-shadow: 0 0 0 8px rgba(243, 217, 139, 0.45), 0 0 0 9999px rgba(6, 6, 9, 0.3); } }

/* boot */
#boot { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 100; background: #0b0b0e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity 0.5s; }
#boot.gone { opacity: 0; pointer-events: none; }
.boot-seal { width: 96px; height: 96px; border-radius: 14px; background: linear-gradient(135deg, #c5301f, #8f2015); color: #f8eed6; font-family: var(--f-kai); font-size: 64px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 0 3px rgba(248, 238, 214, 0.35); animation: bootpulse 1.6s ease-in-out infinite; }
@keyframes bootpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.boot-txt { font-family: var(--f-kai); font-size: 22px; color: var(--dim); letter-spacing: 0.3em; padding-left: 0.3em; text-align: center; }

/* rotate hint for very small landscape phones is not needed: the stage always fits */
@media (prefers-reduced-motion: reduce) { .packart::after, #btn-ignite.ready, .boot-seal { animation: none; } }

  zh: ['', '一画', '二画', '三画', '四画', '五画', '六画', '七画以上'],
  en: ['', '1 stroke', '2 strokes', '3 strokes', '4 strokes', '5 strokes', '6 strokes', '7+ strokes'],
};
const tierOf = (n) => Math.min(Math.max(n, 1), TIER_MAX);
function tierBase(tier, lvl) {
  const t = TIERS[tier];
  return { c: t.c + (lvl - 1) * t.dc, m: t.m + (lvl - 1) * t.dm };
}

// ---------- 字 (characters): the "hands" of the game ----------
// A character is recognised from the set of complete rows (横) and columns (竖).
// Signature = which edge lines are present + how many interior lines:
//   rows: [top, interior count, bottom]   cols: [left, interior count, right]
const CH = {};
const CH_ORDER = [];
const SIG = new Map();
const sigKey = (T, ri, B, L, ci, R, d) => `${T}${ri}${B}|${L}${ci}${R}|${d}`;
function anyLines(k) {
  const out = [];
  for (let a = 0; a <= 1; a++) for (let b = 0; b <= 1; b++) { const i = k - a - b; if (i >= 0) out.push([a, i, b]); }
  return out;
}
const NONE = [[0, 0, 0]];
function defChar(id, g, py, n, x, rowSpecs, colSpecs, o) {
  const def = Object.assign({ id, g, py, n, x, rowSpecs, colSpecs, d: 0, num: 0, tags: [], yi: null, secret: false }, o || {});
  CH[id] = def;
  CH_ORDER.push(id);
  for (const r of rowSpecs) for (const c of colSpecs) {
    const k = sigKey(r[0], r[1], r[2], c[0], c[1], c[2], def.d);
    if (!SIG.has(k)) SIG.set(k, id);
  }
}

// classify a set of complete lines on a w×h sheet
function classifyLines(w, h, rows, cols, diags) {
  const nR = rows.length, nC = cols.length, nD = diags ? diags.length : 0;
  const n = nR + nC + nD;
  if (!n) return null;
  if (nR === h && nC === w) return { id: 'xuan', n };
  const T = rows.includes(0) ? 1 : 0, B = rows.includes(h - 1) ? 1 : 0;
  const L = cols.includes(0) ? 1 : 0, R = cols.includes(w - 1) ? 1 : 0;
  let d = 0;
  if (nD) { if (diags.includes(0)) d |= 1; if (diags.includes(1)) d |= 2; }
  const id = SIG.get(sigKey(T, nR - T - B, B, L, nC - L - R, R, d));
  return { id: id || 'sanbi', n };
}

// a canonical layout of a character on a w×h sheet (for diagrams and hints)
function charLayout(id, w, h) {
  const def = CH[id];
  if (id === 'xuan') return { rows: range(h), cols: range(w), diags: [] };
  if (id === 'sanbi') return { rows: [1, 2], cols: [w - 2, w - 1], diags: [] };
  const spread = (spec, len) => {
    const out = [];
    if (spec[0]) out.push(0);
    const k = spec[1];
    for (let i = 0; i < k; i++) out.push(Math.max(1, Math.min(len - 2, Math.round(((i + 1) * (len - 1)) / (k + 1)))));
    if (spec[2]) out.push(len - 1);
    return [...new Set(out)].sort((a, b) => a - b);
  };
  const r = def.rowSpecs[0] || [0, 0, 0];
  const c = def.colSpecs[0] || [0, 0, 0];
  const diags = [];
  if (def.d & 1) diags.push(0);
  if (def.d & 2) diags.push(1);
  return { rows: spread(r, h), cols: spread(c, w), diags };
}

// every concrete placement of a character on a w×h sheet (rows/cols index sets), used by hints and the practice bot
const _recipeCache = new Map();
function charRecipes(id, w, h) {
  const key = id + ':' + w + 'x' + h;
  if (_recipeCache.has(key)) return _recipeCache.get(key);
  const def = CH[id];
  const out = [];
  const combos = (pool, k) => {
    const res = [];
    const rec = (start, acc) => {
      if (acc.length === k) { res.push(acc.slice()); return; }
      for (let i = start; i < pool.length; i++) { acc.push(pool[i]); rec(i + 1, acc); acc.pop(); }
    };
    rec(0, []);
    return res;
  };
  const expand = (spec, len) => {
    if (spec[1] > len - 2) return [];
    const inner = combos(range(len - 2).map((i) => i + 1), spec[1]);
    return inner.map((mid) => {
      const a = [];
      if (spec[0]) a.push(0);
      a.push(...mid);
      if (spec[2]) a.push(len - 1);
      return a;
    });
  };
  if (id === 'xuan') out.push({ rows: range(h), cols: range(w), diags: [] });
  else if (id !== 'sanbi') {
    const diags = [];
    if (def.d & 1) diags.push(0);
    if (def.d & 2) diags.push(1);
    const seen = new Set();
    for (const rs of def.rowSpecs) for (const cs of def.colSpecs) {
      if (SIG.get(sigKey(rs[0], rs[1], rs[2], cs[0], cs[1], cs[2], def.d)) !== id) continue;
      for (const rows of expand(rs, h)) for (const cols of expand(cs, w)) {
        if (rows.length === h && cols.length === w) continue;
        const k2 = rows.join(',') + '|' + cols.join(',');
        if (seen.has(k2)) continue;
        seen.add(k2);
        out.push({ rows, cols, diags });
      }
    }
  }
  _recipeCache.set(key, out);
  return out;
}

function copyNote(s, run, lang) {
  if (!s || !run) return '';
  const t = copyTarget(run, s);
  if (!t) return lang === 'zh' ? '\n[n|右侧无可复制之印]' : '\n[n|Nothing to copy]';
  return lang === 'zh' ? `\n[n|当前复制：${SEALS[t.id].zh}]` : `\n[n|Copying: ${SEALS[t.id].en}]`;
}

// ---------- 字帖 (copybooks) and 文房 (studio items) ----------
const ITEMS = {};
const ITEM_ORDER = [];
function defItem(id, zh, en, kind, cost, o) {
  ITEMS[id] = Object.assign({ id, zh, en, kind, cost, w: 1 }, o);
  ITEM_ORDER.push(id);
}
// --- copybooks: +1 level to one stroke tier
const TIE_BOOK = [null,
  ['上大人', 'Shang Da Ren'], ['二王帖', 'Model Letters of the Two Wangs'], ['三字经', 'Three-Character Classic'],
  ['四体书势', 'Forces of the Four Scripts'], ['五经文字', 'Characters of the Five Classics'],
  ['六体书论', 'On the Six Scripts'], ['书谱', 'Treatise on Calligraphy']];
for (let t = 1; t <= TIER_MAX; t++) {
  defItem('tie' + t, '《' + TIE_BOOK[t][0] + '》', TIE_BOOK[t][1], 'tie', 3, {
    tier: t,
    dz: (run) => {

  if (a <= 8) return ANTE_BASE[a];

  let v = ANTE_BASE[8];

}

function defBoss(id, zh, en, min, o) { BOSSES[id] = Object.assign({ id, zh, en, min, flags: {} }, o); BOSS_ORDER.push(id); }
function scatter(run, n, fn, distinct) {
  const rd = run.round, w = run.w, h = run.h;
  const usedR = new Set(), usedC = new Set();
  let guard = 0;
  while (n > 0 && guard++ < 500) {
    const i = rndInt(run, 'boss', w * h);
    if (rd.board[i] || rd.holes[i]) continue;
    const x = i % w, y = Math.floor(i / w);
    if (distinct && (usedR.has(y) || usedC.has(x))) continue;
    usedR.add(y); usedC.add(x);
    fn(i); n--;
  }
}

const BASE_STATS = {
  inkMax: 100, ignites: 4, discards: 3, tray: 3, sealSlots: 5, itemSlots: 2, interestCap: 5, shopSlots: 2,
  discount: 0, rerollOff: 0, freeRerolls: 0, peek: 0, flip: 0, diag: 0, costAdd: 0, probMul: 1, tieBonus: 0, edRate: 0,
};

// ---------- engine: state, stats, the sheet, and scoring ----------
function flag(run, key) {
  const rd = run.round;
  if (rd && rd.boss) { const v = BOSSES[rd.boss].flags[key]; if (v) return v; }
  const dv = DECKS[run.deckId].flags[key];
  if (dv) return dv;
  for (let i = run.stake; i >= 1; i--) { const f = STAKES[i].flags; if (f && f[key]) return f[key]; }
  for (const s of run.seals) {
    if (rd && rd.sealOff[s.uid]) continue;
    const f = SEALS[s.id].flags;
    if (f && f[key]) return f[key];
  }
  return 0;
}
function stat(run, key) {
  let v = BASE_STATS[key] || 0;
  const add = (m) => { if (m && m[key] != null) v += m[key]; };
  add(DECKS[run.deckId].mods);
  for (let i = 1; i <= run.stake; i++) add(STAKES[i].mods);
  for (const id in run.vouchers) add(VOUCHERS[id].mods);
  const rd = run.round;
  if (rd && rd.boss) add(BOSSES[rd.boss].mods);
  if (rd) add(rd.tmp);
  for (const s of run.seals) {
    if (rd && rd.sealOff[s.uid]) continue;
    add(SEALS[s.id].mods);
  }
  for (const s of run.seals) {
    if (rd && rd.sealOff[s.uid]) continue;
    const d = SEALS[s.id];
    if (d.mod) v = d.mod(run, s, key, v);
  }
  if (key === 'inkMax') return Math.max(20, v);
  if (key === 'ignites' || key === 'tray') return Math.max(1, v);
  if (key === 'discards' || key === 'itemSlots' || key === 'shopSlots' || key === 'freeRerolls' || key === 'peek') return Math.max(0, v);
  if (key === 'sealSlots') return Math.max(1, v);
  if (key === 'discount') return clamp(v, -100, 75);
  return v;

  if (!it) return { ok: false, why: 'gone' };
  const def = ITEMS[it.id];
  const u = itemUsable(run, def);
  if (!u.ok) return u;
  run.items.splice(idx, 1);
  if (!applyItem(run, def, target)) { run.items.splice(idx, 0, it); return { ok: false, why: 'target' }; }
  return { ok: true, id: it.id };
}

// ---- hints: characters within reach of the lines already complete
function charHints(run, limit, known) {
  const rd = run.round;
  if (!rd) return [];
  const w = run.w, h = run.h, L = findLines(run);
  const cur = L.n ? classifyLines(w, h, L.rows, L.cols, L.diags).id : null;
  const hasR = new Set(L.rows), hasC = new Set(L.cols);
  const rowFree = [], colFree = [];
  for (let y = 0; y < h; y++) { let ok = true; for (let x = 0; x < w; x++) if (rd.holes[y * w + x]) ok = false; rowFree.push(ok); }
  for (let x = 0; x < w; x++) { let ok = true; for (let y = 0; y < h; y++) if (rd.holes[y * w + x]) ok = false; colFree.push(ok); }
  const out = [];
  for (const id of CH_ORDER) {
    const def = CH[id];
    if (id === 'sanbi' || id === cur || def.d) continue;
    if (def.secret && !(known && known[id])) continue;
    let best = null;
    for (const rc of charRecipes(id, w, h)) {
      if (rc.rows.length < L.rows.length || rc.cols.length < L.cols.length) continue;
      let ok = true, miss = 0, need = 0;
      for (const y of L.rows) if (!rc.rows.includes(y)) { ok = false; break; }
      if (!ok) continue;
      for (const x of L.cols) if (!rc.cols.includes(x)) { ok = false; break; }
      if (!ok) continue;
      for (const y of rc.rows) if (!hasR.has(y)) { if (!rowFree[y]) { ok = false; break; } miss++; }
      if (!ok) continue;
      for (const x of rc.cols) if (!hasC.has(x)) { if (!colFree[x]) { ok = false; break; } miss++; }
      if (!ok || miss === 0 || miss > 2) continue;
      const seen = new Set();
      for (const y of rc.rows) for (let x = 0; x < w; x++) seen.add(y * w + x);
      for (const x of rc.cols) for (let y = 0; y < h; y++) seen.add(y * w + x);
      for (const i of seen) if (!rd.board[i]) need++;
      if (!best || miss < best.miss || (miss === best.miss && need < best.need)) best = { id, miss, need, rows: rc.rows, cols: rc.cols };
    }
    if (best) out.push(best);
  }
  out.sort((a, b) => a.miss - b.miss || a.need - b.need || CH[b.id].x - CH[a.id].x);
  return out.slice(0, limit || 3);
}

// ---- integrity check (used by the practice bot and tests)
function checkRun(run) {
  const errs = [];
  const bad = (m) => errs.push(m);
  if (!isFinite(run.money)) bad('money');
  if (run.seals.filter((s) => s.ed !== 'xian').length > stat(run, 'sealSlots') + 2) bad('too many seals');
  for (let t = 1; t <= TIER_MAX; t++) if (!(run.tiers[t] >= 1)) bad('tier ' + t);
  const uids = new Set();
  for (const p of run.deck) { if (uids.has(p.uid)) bad('dup uid'); uids.add(p.uid); if (!SHAPES[p.shape]) bad('shape ' + p.shape); if (!INK[p.ink]) bad('ink ' + p.ink); if (p.enh && !ENH[p.enh]) bad('enh'); }
  const rd = run.round;
  if (rd && run.phase === 'round') {
    if (!(rd.ink >= 0)) bad('ink<0');
    if (rd.ignites < 0 || rd.discards < 0) bad('neg counters');
    if (rd.board.length !== run.w * run.h) bad('board size');
    for (const t of rd.tray) if (t && !uids.has(t.uid)) bad('tray ghost');
    const held = rd.tray.filter(Boolean).map((t) => t.uid);
    if (new Set(held).size !== held.length) bad('tray dup');
    for (const u of rd.draw) { if (!uids.has(u)) bad('draw ghost'); if (held.includes(u)) bad('draw/tray overlap'); }
    if (!isFinite(rd.score) || rd.score < 0) bad('score');
  }
  for (const s of run.seals) if (!SEALS[s.id]) bad('seal ' + s.id);
  for (const it of run.items) if (!ITEMS[it.id]) bad('item ' + it.id);
  return errs;
}

    'help.1': '<h3>落墨成笔</h3><p>把墨块拖到纸上（轻点可旋转）。填满的<b>整行</b>是一「横」，<b>整列</b>是一「竖」。每块墨耗去与格数相同的<b>墨</b>，墨尽则不能再落。</p><h3>积笔成字</h3><p>按下<b>挥毫</b>，纸上所有成笔的横竖一同计分并消去——它们合起来写成一个<b>字</b>。须与字的图样<b>完全吻合</b>：在纸边还是在中间都有讲究；多一笔、少一笔，就成了另一个字，或是不成字的<b>散笔</b>。</p>',
    'help.2': '<h3>形 × 神</h3><p>得分 = <b>形 × 神</b>。</p><ul><li>字的<b>画数</b>定下基础的形与神，可用<b>字帖</b>提升等级；</li><li>每个计分的墨格 <b>形+5</b>；横竖<b>交点</b>上的格会计两次；</li><li>一条笔画若全由同一种墨写成（<b>纯色</b>）：墨 形+40、朱 神+4、青 神×1.2、金 +1 文；</li><li>最后再乘这个字的<b>字格</b>（王 ×3、田 ×4……）。</li></ul><h3>一卷八法</h3><p>一卷共八「法」，每法三局：<b>习字</b>、<b>课业</b>，与一张自带规矩的<b>名帖</b>。在挥毫的次数用完之前达到目标分数即可过关。过关得<b>润笔</b>，可在文房铺添置：</p><ul><li><b>印</b>——至多五枚，自左至右依次生效，是一卷的根本；</li><li><b>字帖</b>——提升某一画数的等级；</li><li><b>文房</b>——为墨块染色、赋予墨性、拓印、销毁，或在纸上制格；</li><li><b>陈设</b>——整卷有效的添置。</li></ul><h3>操作</h3><ul><li>拖动落墨；轻点、右键、滚轮或 <b>R</b> 旋转；拖到「洗笔」上换块。</li><li>键盘：<b>1–4</b> 选块，方向键移动，<b>空格</b>落墨或挥毫，<b>Q</b> 洗笔，<b>Z / X / C</b> 字典、墨匣、卷况，<b>Esc</b> 暂歇。</li><li>计分时点击任意处可加速。</li></ul>',

// ---------- effects layer: ink splashes, sparks, floating numbers, screen shake ----------
const FX = (() => {
  let cv = null, c = null, k = 1, W = 0, H = 0, raf = 0, last = 0;
  const parts = [], texts = [], rings = [], custom = [];
  let drag = null, flashA = 0, flashCol = '#fff', shake = 0, shakeT = 0, stageEl = null;
  function init() {
    cv = document.getElementById('fx'); c = cv.getContext('2d');
    stageEl = document.getElementById('stage');

  }
  function resize() {
    if (!cv) return;
    k = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * k); cv.height = Math.round(H * k);

  }
  const busy = () => parts.length || texts.length || rings.length || custom.length || drag || flashA > 0.004 || shake > 0.05;

      const p = parts[i];

      p.vy += p.g * dt;
      const f = Math.pow(p.drag, dt * 60);
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = texts.length - 1; i >= 0; i--) {
