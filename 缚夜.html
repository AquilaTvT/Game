<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="author" content="藤野京">
<meta name="description" content="缚夜——一笔成环，万鬼皆封。画圈封印百鬼的动作肉鸽，作者藤野京。">
<meta name="theme-color" content="#05060d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="缚夜">
<meta name="format-detection" content="telephone=no">
<title>缚夜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305060d'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%237fe8ff' stroke-width='5' stroke-linecap='round' stroke-dasharray='104 16'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ff5a3c'/%3E%3C/svg%3E">
<style>
:root { --kai: "Kaiti SC", STKaiti, KaiTi, "AR PL UKai CN", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", SimSun, serif; --num: Georgia, "Times New Roman", "Noto Serif", serif;
  --ink: #05060d; --txt: #ece6d8; --dim: #9a968c; --gold: #f1cf7a; --red: #e2452f; --cyan: #7fe8ff; --line: rgba(241, 207, 122, 0.28); --glass: rgba(10, 12, 22, 0.72); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: clamp(11.5px, calc(0.9vmin + 0.55vmax), 21px); }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--txt); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif; line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#gl { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
#boot { position: fixed; inset: 0; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; z-index: 100; transition: opacity 0.6s; }
#boot.gone { opacity: 0; pointer-events: none; }
.boot-ring { width: 5rem; height: 5rem; border-radius: 50%; border: 3px solid rgba(127, 232, 255, 0.15); border-top-color: var(--cyan); animation: spin 0.9s linear infinite; }
.boot-txt { font-family: var(--kai); font-size: 2rem; letter-spacing: 0.4em; padding-left: 0.4em; color: var(--txt); }
.boot-sub { color: var(--dim); }
@keyframes spin { to { transform: rotate(360deg); } }
.jade { display: inline-block; width: 0.72em; height: 0.72em; margin-right: 0.3em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #eafff4, #4fd6a0 55%, #14684a); box-shadow: 0 0 0.5em rgba(80, 230, 170, 0.6); vertical-align: -0.04em; }
.rk-n { color: var(--gold); font-weight: 700; } .rk-k { color: #fff; } .rk-w { color: #ff8a73; }

/* ---- buttons */
.btn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-height: 3.1rem; padding: 0.5rem 1.6rem; border-radius: 0.5rem; font-family: var(--kai); font-size: 1.45rem; font-weight: 700; letter-spacing: 0.12em;
  color: var(--txt); background: linear-gradient(180deg, rgba(40, 44, 66, 0.9), rgba(18, 20, 34, 0.92)); border: 1px solid var(--line); box-shadow: 0 0.25rem 0.9rem rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08); transition: transform 0.1s, filter 0.15s, border-color 0.15s; pointer-events: auto; }
.btn small { font-family: inherit; font-size: 0.82rem; font-weight: 400; letter-spacing: 0.04em; color: var(--dim); margin-top: 0.1rem; }
.btn:hover { filter: brightness(1.25); border-color: var(--gold); }
.btn:active { transform: translateY(2px) scale(0.985); }
.btn:disabled { opacity: 0.38; cursor: default; filter: none; }
.btn.gold { color: #2a1604; background: linear-gradient(180deg, #ffe7a0, #d99f3a); border-color: #fff3c8; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
.btn.gold small { color: rgba(60, 30, 4, 0.75); }
.btn.red { background: linear-gradient(180deg, #e8553c, #9c2014); border-color: #ffb09a; }
.btn.ghost { background: rgba(255, 255, 255, 0.04); box-shadow: none; font-weight: 400; }
.btn.sm { min-height: 2.4rem; padding: 0.3rem 1rem; font-size: 1.1rem; }
.btn.big { min-height: 3.8rem; font-size: 1.8rem; width: 100%; }

/* ---- emblems: a talisman, a relic */
.emb { flex: none; display: inline-flex; align-items: center; justify-content: center; position: relative; width: 2.9rem; height: 2.9rem; border-radius: 0.45rem; font-family: var(--kai); font-size: 1.85rem; font-weight: 700; color: #fff5e0;
  background: linear-gradient(145deg, #ea5a40, #8a1c12); box-shadow: inset 0 0 0 2px rgba(255, 235, 200, 0.5), 0 0.2rem 0.6rem rgba(0, 0, 0, 0.5); text-shadow: 0 2px 2px rgba(60, 8, 2, 0.7); }
.emb.k-trail { background: linear-gradient(145deg, #3fb6d8, #134c78); text-shadow: 0 2px 2px rgba(4, 24, 50, 0.7); }
.emb.k-aux { background: linear-gradient(145deg, #58c78a, #145236); text-shadow: 0 2px 2px rgba(4, 40, 20, 0.7); }
.emb.k-body { background: linear-gradient(145deg, #9a7be0, #3a2478); text-shadow: 0 2px 2px rgba(20, 8, 60, 0.7); }
.emb.k-evo { background: linear-gradient(145deg, #fff0b0, #d08a1e 55%, #7a3c08); color: #3a1802; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); box-shadow: inset 0 0 0 2px #fff6d0, 0 0 1rem rgba(255, 200, 80, 0.7); }
.emb.k-relic { background: linear-gradient(145deg, #2a3040, #0c0e18); color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold), 0 0.2rem 0.6rem rgba(0, 0, 0, 0.5); border-radius: 50%; text-shadow: none; }
.emb.big { width: 5.2rem; height: 5.2rem; font-size: 3.4rem; border-radius: 0.7rem; }
.emb.k-relic.big { border-radius: 50%; }
.emb.sm { width: 2.15rem; height: 2.15rem; font-size: 1.3rem; border-radius: 0.35rem; }
.emb.k-relic.sm { border-radius: 50%; }
.emb em { position: absolute; right: -0.3rem; bottom: -0.35rem; min-width: 1.05rem; height: 1.05rem; padding: 0 0.2rem; border-radius: 0.55rem; background: #0b0c14; border: 1px solid var(--line); color: var(--gold); font: 700 0.72rem/1rem var(--num); text-align: center; text-shadow: none; }
.pips { display: inline-flex; gap: 0.22rem; vertical-align: middle; }
.pips i { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
.pips i.on { background: var(--gold); box-shadow: 0 0 0.4rem rgba(241, 207, 122, 0.8); }
.pips i.nx { background: #fff; animation: pulse 0.7s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 0.35; } to { opacity: 1; } }

/* ---- HUD */
#hud { position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s; }
#hud.on { opacity: 1; }
#hud > * { position: absolute; }
.xp { left: 0; top: 0; width: 100%; height: 0.42rem; background: rgba(255, 255, 255, 0.07); }
.xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2fd6a0, #9ffff0); box-shadow: 0 0 0.8rem rgba(80, 255, 200, 0.9); transition: width 0.15s; }
.tl { left: 0.9rem; top: 0.9rem; display: flex; flex-direction: column; gap: 0.35rem; }
.lv { font: 700 1.05rem var(--num); color: #b8fff0; letter-spacing: 0.06em; text-shadow: 0 0 0.5rem rgba(60, 255, 200, 0.6); }
.hearts { display: flex; gap: 0.3rem; align-items: center; }
.hearts i { width: 1.35rem; height: 1.2rem; background: rgba(255, 255, 255, 0.12); clip-path: path("M12 21 C-6 9 3 -3 12 5 C21 -3 30 9 12 21 Z"); -webkit-clip-path: polygon(50% 100%, 4% 48%, 2% 22%, 18% 4%, 36% 6%, 50% 22%, 64% 6%, 82% 4%, 98% 22%, 96% 48%); clip-path: polygon(50% 100%, 4% 48%, 2% 22%, 18% 4%, 36% 6%, 50% 22%, 64% 6%, 82% 4%, 98% 22%, 96% 48%); }
.hearts i.on { background: linear-gradient(180deg, #ff8a9a, #e2203c); filter: drop-shadow(0 0 0.35rem rgba(255, 60, 90, 0.9)); }
.hearts b { width: 1.2rem; height: 1.2rem; border-radius: 50%; border: 2px solid rgba(127, 232, 255, 0.3); margin-left: 0.2rem; }
.hearts b.on { border-color: var(--cyan); box-shadow: 0 0 0.6rem rgba(127, 232, 255, 0.9), inset 0 0 0.4rem rgba(127, 232, 255, 0.6); }
.tc { left: 50%; top: 0.85rem; transform: translateX(-50%); text-align: center; width: min(60vw, 30rem); }
.stg { font-family: var(--kai); font-size: 1.05rem; letter-spacing: 0.3em; padding-left: 0.3em; color: var(--dim); }
.tm { font: 700 1.7rem var(--num); color: var(--txt); text-shadow: 0 2px 6px #000; }
.tm.soon { color: #ff8a73; animation: pulse 0.5s ease-in-out infinite alternate; }
.tm.off { display: none; }
.bossbar { display: none; margin-top: 0.2rem; }
.bossbar.on { display: block; }
.bossbar span { font-family: var(--kai); font-size: 1.5rem; font-weight: 700; color: #ffb09a; letter-spacing: 0.3em; padding-left: 0.3em; text-shadow: 0 0 0.8rem rgba(255, 60, 40, 0.8); }
.bossbar div { height: 0.6rem; margin-top: 0.25rem; border-radius: 0.3rem; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 120, 100, 0.5); overflow: hidden; }
.bossbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff3a2a, #ffb04a); box-shadow: 0 0 0.8rem rgba(255, 80, 40, 0.9); transition: width 0.2s; }
.tr { right: 0.9rem; top: 0.9rem; display: flex; align-items: center; gap: 0.8rem; }
.kl { font: 700 1.15rem var(--num); color: var(--txt); text-shadow: 0 2px 6px #000; }
.kl::before { content: "封 "; font-family: var(--kai); color: #ff8a73; }
.pausebtn { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); display: flex; align-items: center; justify-content: center; gap: 0.3rem; pointer-events: auto; }
.pausebtn i { width: 0.26rem; height: 0.95rem; background: var(--gold); border-radius: 1px; }
.strip { left: 0.9rem; bottom: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.5rem; max-width: 46vw; }
.dashbtn { right: 1.4rem; bottom: 1.6rem; width: 5.2rem; height: 5.2rem; border-radius: 50%; display: none; align-items: center; justify-content: center; font-family: var(--kai); font-size: 2rem; font-weight: 700; color: var(--cyan); pointer-events: auto;
  background: conic-gradient(rgba(127, 232, 255, 0.5) var(--cd, 100%), rgba(255, 255, 255, 0.06) 0); border: 2px solid rgba(127, 232, 255, 0.4); opacity: 0.6; }
.dashbtn.ready { opacity: 1; box-shadow: 0 0 1.2rem rgba(127, 232, 255, 0.6); }
body.touch .dashbtn { display: flex; }
body.touch .strip { bottom: 0.7rem; max-width: 62vw; }
.stick { left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity 0.15s; }
.stick.on { opacity: 1; }
.stick::before { content: ""; position: absolute; left: -64px; top: -64px; width: 128px; height: 128px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.04); }
.stick i { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: rgba(127, 232, 255, 0.35); border: 2px solid rgba(127, 232, 255, 0.8); }
.banner { left: 50%; top: 24%; transform: translate(-50%, -50%); text-align: center; opacity: 0; white-space: nowrap; }
.banner.go { animation: banner 2.6s ease-out both; }
.banner .b1 { font-family: var(--kai); font-size: 1.5rem; letter-spacing: 0.6em; padding-left: 0.6em; color: var(--gold); }
.banner .b2 { font-family: var(--kai); font-size: 3.6rem; font-weight: 700; letter-spacing: 0.25em; padding-left: 0.25em; color: #fff; text-shadow: 0 0 1.2rem rgba(255, 255, 255, 0.5), 0 3px 8px #000; }
.banner.boss .b1 { color: #ff6a55; } .banner.boss .b2 { color: #ffd2c8; text-shadow: 0 0 1.6rem rgba(255, 60, 30, 0.95), 0 3px 8px #000; }
.banner.clear .b1 { font-size: 3rem; font-weight: 700; color: #fff; letter-spacing: 0.5em; } .banner.clear .b2 { font-size: 1.4rem; color: var(--gold); }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); filter: blur(6px); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: none; } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%); } }
.hint { left: 50%; bottom: 18%; transform: translateX(-50%); padding: 0.55rem 1.3rem; border-radius: 2rem; background: var(--glass); border: 1px solid var(--line); font-size: 1.15rem; color: #fff; opacity: 0; transition: opacity 0.4s; white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }
.hint.on { opacity: 1; }
#hud.dim .hint, #hud.dim .banner, #hud.dim .dashbtn { opacity: 0 !important; }

/* ---- menu layer */
#menu { position: absolute; inset: 0; display: none; pointer-events: auto; overflow: hidden; }
#menu.on { display: block; }
.title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; padding: 1.5rem; animation: fadein 0.8s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.logo { position: relative; width: 16rem; height: 16rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.enso { position: absolute; inset: 0; }
.enso svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 0.9rem rgba(127, 232, 255, 0.85)); }
.enso circle { fill: none; stroke-linecap: round; transform-origin: 50% 50%; }
.enso .e1 { stroke: #dffaff; stroke-width: 5; stroke-dasharray: 500 60; animation: draw 2.2s cubic-bezier(0.3, 0.8, 0.3, 1) both, turn 60s linear infinite; }
.enso .e2 { stroke: rgba(255, 110, 70, 0.9); stroke-width: 1.5; stroke-dasharray: 3 9; animation: turn 40s linear infinite reverse; }
@keyframes draw { from { stroke-dashoffset: 560; } to { stroke-dashoffset: 0; } }
@keyframes turn { to { transform: rotate(360deg); } }
.lt { font-family: var(--kai); font-size: 6.2rem; font-weight: 700; line-height: 1; letter-spacing: 0.08em; padding-left: 0.08em; color: #fff; text-shadow: 0 0 1.4rem rgba(127, 232, 255, 0.9), 0 0 3.2rem rgba(60, 160, 255, 0.6), 0 4px 10px #000; }
.ls { margin-top: 0.5rem; font: 400 0.95rem var(--num); letter-spacing: 0.75em; padding-left: 0.75em; color: var(--cyan); opacity: 0.85; }
.tag { font-family: var(--kai); font-size: 1.35rem; letter-spacing: 0.35em; padding-left: 0.35em; color: var(--gold); text-shadow: 0 2px 6px #000; }
.mlist { display: flex; flex-direction: column; gap: 0.65rem; width: min(24rem, 86vw); margin-top: 0.4rem; }
.mlist > .btn { width: 100%; }
.mrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
.mrow .btn { padding: 0.3rem 0.2rem; letter-spacing: 0.04em; }
.foot { position: absolute; left: 0; right: 0; bottom: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 1rem; font-size: 0.9rem; color: var(--dim); }
.seal { font-family: var(--kai); font-weight: 700; color: #fff0e4; background: var(--red); padding: 0.12rem 0.45rem; border-radius: 0.2rem; letter-spacing: 0.15em; box-shadow: 0 0 0.6rem rgba(226, 69, 47, 0.7); }
.foot .jd { color: #b8fff0; font: 700 1rem var(--num); }

.page { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 0.8rem; padding: 1.2rem clamp(0.9rem, 4vw, 3rem) 1rem; background: rgba(4, 5, 12, 0.8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fadein 0.3s ease both; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.ph { display: flex; align-items: center; gap: 1rem; flex: none; }
.pt { font-family: var(--kai); font-size: 2.4rem; font-weight: 700; letter-spacing: 0.3em; color: var(--gold); flex: 1; }
.pj { font: 700 1.3rem var(--num); color: #b8fff0; }
.psub { color: var(--dim); font-size: 1rem; flex: none; }
.nogl { margin: auto; font-size: 1.3rem; text-align: center; max-width: 30rem; }
.hwrap { display: flex; gap: 1.2rem; flex: 1; min-height: 0; }
.heroes { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; align-content: start; }
.hero { position: relative; text-align: left; padding: 0.9rem 0.9rem 0.8rem 4.4rem; min-height: 6.2rem; border-radius: 0.7rem; background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.1); transition: border-color 0.15s, transform 0.12s, background 0.15s; }
.hero:hover { border-color: var(--hc); }
.hero.sel { border-color: var(--hc); background: rgba(24, 28, 46, 0.9); box-shadow: 0 0 1.4rem color-mix(in srgb, var(--hc) 45%, transparent), inset 0 0 0 1px var(--hc); }
.hero .orb { position: absolute; left: 0.9rem; top: 1rem; width: 2.7rem; height: 2.7rem; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, var(--hc) 45%, transparent 72%); box-shadow: 0 0 1.2rem var(--hc); }
.hero .hn { font-family: var(--kai); font-size: 1.55rem; font-weight: 700; color: #fff; }
.hero .hd { font-size: 0.92rem; color: var(--dim); margin-top: 0.15rem; }
.hero .hb { font-size: 0.82rem; color: var(--gold); margin-top: 0.3rem; }
.hero.lock { opacity: 0.55; } .hero.lock .orb { background: radial-gradient(circle, #555, transparent 70%); box-shadow: none; }
.hside { width: min(21rem, 34vw); display: flex; flex-direction: column; gap: 0.8rem; flex: none; }
.stats { padding: 0.9rem; border-radius: 0.7rem; background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 0.55rem; }
.st { display: flex; align-items: center; gap: 0.7rem; font-size: 0.95rem; color: var(--dim); }
.st span { width: 3.4rem; flex: none; }
.st i { flex: 1; height: 0.5rem; border-radius: 0.25rem; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.st b { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), #fff); }
.nlab { font-family: var(--kai); font-size: 1.6rem; font-weight: 700; color: var(--gold); text-align: center; letter-spacing: 0.3em; padding-left: 0.3em; }
.nights { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
.nb { height: 2.5rem; border-radius: 0.4rem; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); font: 700 1.1rem var(--num); }
.nb.sel { background: linear-gradient(180deg, #ffe7a0, #d99f3a); color: #2a1604; border-color: #fff3c8; }
.nb.lock { opacity: 0.3; }

/* ---- the choice */
.choice { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; padding: 1rem; transition: opacity 0.25s; }
.choice.out { opacity: 0; }
.chead { text-align: center; }
.ct { font-family: var(--kai); font-size: 3rem; font-weight: 700; letter-spacing: 0.5em; padding-left: 0.5em; color: #fff; text-shadow: 0 0 1.2rem rgba(255, 220, 140, 0.9), 0 3px 8px #000; }
.choice.relic .ct { color: var(--gold); }
.cs { color: var(--dim); font-size: 1.05rem; letter-spacing: 0.2em; }
.cards { display: flex; gap: 1.1rem; justify-content: center; align-items: stretch; flex-wrap: wrap; max-width: 100%; }
.card { position: relative; width: min(15.5rem, 29vw); min-height: 19rem; padding: 1.4rem 1rem 1.1rem; border-radius: 0.9rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; text-align: center;
  background: linear-gradient(180deg, rgba(34, 38, 60, 0.96), rgba(12, 14, 26, 0.97)); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 1rem 2.4rem rgba(0, 0, 0, 0.6); animation: cardin 0.38s cubic-bezier(0.2, 1.2, 0.4, 1) both; transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s; }
@keyframes cardin { from { opacity: 0; transform: translateY(2.4rem) scale(0.92); } to { opacity: 1; transform: none; } }
.card:hover { transform: translateY(-0.5rem); border-color: var(--gold); box-shadow: 0 1.4rem 3rem rgba(0, 0, 0, 0.7), 0 0 1.6rem rgba(241, 207, 122, 0.35); }
.card.picked { transform: translateY(-1rem) scale(1.06); border-color: #fff; box-shadow: 0 0 3rem rgba(255, 240, 200, 0.8); }
.card.k-evo { border-color: #ffd97a; background: linear-gradient(180deg, rgba(70, 50, 14, 0.96), rgba(20, 14, 6, 0.97)); box-shadow: 0 0 2rem rgba(255, 200, 80, 0.45); }
.card.k-relic { border-color: var(--line); }
.cn { font-family: var(--kai); font-size: 1.75rem; font-weight: 700; color: #fff; margin-top: 0.3rem; }

// ---------- the simulation: no drawing, no sound, no DOM — it only pushes events for the front end ----------
const ARENA = 1100;          // radius of the warded ground
const SPAWN_R = 760;         // yokai appear this far from the spirit
const STEP = 1 / 60;
const STAGE_HP = [1, 1.6, 2.4, 3.4, 4.6];
const xpNeed = (l) => Math.floor(5 + l * 4 + l * l * 0.45);

class World {
  constructor(o) {
    this.seed = String(o.seed || makeSeed());
    this.rng = makeRng(hashStr(this.seed));
    this.heroId = HEROES[o.hero] ? o.hero : 'fox';
    this.hero = HEROES[this.heroId];
    this.night = clamp(o.night || 1, 1, NIGHT_MAX);
    this.nm = nightMods(this.night);
    this.daily = o.daily || null;
    this.boons = o.boons || {};
    this.endless = false;
    this.t = 0; this.stage = 0; this.stageT = 0; this.loop = 0;
    this.phase = 'play';             // play · choice · dead · won
    this.pending = null;
    this.lv = Object.assign({}, this.hero.start);
    this.evo = {}; this.rel = {}; this.banned = {};
    this.rerolls = 1 + (this.boons.reroll || 0); this.banishes = this.boons.banish || 0;
    this.revives = this.boons.charm ? 1 : 0;
    this.level = 1; this.xp = 0; this.need = xpNeed(1); this.due = 0;
    this.stats = { kills: 0, seals: 0, maxRing: 0, orbs: 0, hits: 0, dmg: 0, bosses: 0, stageHits: 0, score: 0 };
    this.p = { x: 0, y: 0, vx: 0, vy: 0, a: -Math.PI / 2, hp: 1, inv: 1.2, dash: 0, dashN: 1, dashT: 0, dx: 0, dy: -1, shield: 0, shieldT: 0, slowT: 0 };
    this.recalc();
    this.p.hp = this.S.maxHp;
    this.p.shield = this.S.shield ? 1 : 0;
    this.tx = []; this.ty = []; this.tl = 0;          // the trail
    this.foes = []; this.shots = []; this.souls = []; this.zones = []; this.allies = []; this.timers = [];
    this.boss = null; this.bossParts = null;
    this.ev = [];
    this.lastSeal = -9; this.combo = 0; this.sealedKills = 0; this.healCount = 0;
    this.slowAll = 0; this.boltT = 2; this.shikiT = []; this.arenaR = ARENA;
    this.wt = []; this.bossOn = false; this.clearT = 0; this.cutCd = 0; this.cutters = 0;
    this.beginStage(o.stage || 0);
    if (o.save) this.restore(o.save);
  }

  // ---- derived numbers: everything a talisman, relic or boon changes ends up here
  recalc() {
    const H = this.hero, B = this.boons, R = this.rel, E = this.evo;
    const lv = (k) => this.lv[k] || 0;
    const S = this.S = {};
    S.power = 10 * (1 + 0.25 * lv('power')) * (1 + 0.04 * (B.power || 0)) * (H.sealMul || 1) * (R.glass ? 1.6 : 1);
    S.multi = 0.05 + (lv('multi') ? 0.05 + 0.03 * lv('multi') : 0);
    S.trail = H.trail * (1 + 0.18 * lv('long')) * (1 + 0.04 * (B.trail || 0)) * (R.tail ? 1.4 : 1);
    S.speed = H.spd * (1 + 0.07 * lv('swift')) * (R.tail ? 0.94 : 1);
    S.agil = 12 + 1.2 * lv('swift');
    S.magnet = 95 * (1 + 0.35 * lv('magnet')) * (1 + 0.1 * (B.magnet || 0));
    S.xpMul = (1 + 0.05 * lv('magnet')) * (1 + 0.03 * (B.xp || 0)) * (R.gold ? 1.3 : 1);
    S.maxHp = Math.max(1, H.hp + lv('vital') + (B.heart || 0) - (R.glass ? 1 : 0));
    S.dashCd = 2.6 * (1 - 0.12 * lv('dash'));
    S.dashMax = lv('dash') >= 5 ? 3 : lv('dash') >= 3 ? 2 : 1;
    S.chain = lv('chain'); S.chainMul = 0.5 + 0.1 * lv('chain'); S.chainJump = E.tenbatsu ? 2 : 1;
    const bm = H.burnMul || 1, reach = E.zero ? 1.5 : 1;
    S.burn = lv('burn') ? (0.25 + 0.15 * lv('burn')) * bm : 0; S.burnDur = 2.5 + 0.5 * lv('burn');
    S.frost = lv('frost') ? (50 + 25 * lv('frost')) * reach : 0; S.frostDur = 0.9 + 0.3 * lv('frost');
    S.pull = lv('pull') ? (30 + 22 * lv('pull')) * reach : 0;
    S.blast = lv('blast') ? 60 + 25 * lv('blast') : 0; S.blastMul = 0.4 + 0.15 * lv('blast');
    S.echo = lv('echo') ? (lv('echo') >= 4 ? 2 : 1) + (E.kodama ? 1 : 0) : 0; S.echoMul = E.kodama ? 1 : 0.3 + 0.12 * lv('echo');
    S.wisp = lv('wisp') ? 0.12 + 0.09 * lv('wisp') : 0; S.wispMax = lv('wisp') ? (3 + 2 * lv('wisp')) * (E.hyakki ? 2 : 1) : 0;
    S.exec = lv('exec') ? 0.06 + 0.06 * lv('exec') : 0; S.execBoss = 0.08 * lv('exec');
    S.great = lv('great') ? 1.25 + 0.2 * lv('great') : 0;
    S.ink = lv('ink') ? (0.45 + 0.25 * lv('ink')) * bm * (E.gouka ? 2 : 1) : 0;
    S.shock = lv('shock') ? 0.4 + 0.2 * lv('shock') : 0;
    S.shiki = lv('shiki') ? lv('shiki') + (R.orbit ? 2 : 0) : 0; S.shikiRate = E.hyakki ? 0.45 : 0.9;
    S.ward = lv('ward') ? 1 + lv('ward') + (R.orbit ? 2 : 0) : 0; S.wardMul = 0.4 + 0.1 * lv('ward');
    S.bolt = lv('bolt') ? 3.4 - 0.45 * lv('bolt') : 0; S.boltMul = 1.1 + 0.3 * lv('bolt');
    S.shield = lv('shield') ? 17 - 2 * lv('shield') : 0;
    S.pct = E.gouka ? 0.04 : 0;
    S.inv = 1.5 + (R.thorn ? 0.6 : 0);
  }

  // ---- one fixed step.  inp: { x, y } wanted direction (length 0..1), dash: pressed this step
  step(inp) {
    if (this.phase !== 'play') return;
    const dt = STEP;
    this.t += dt; this.stageT += dt;
    if (this.slowAll > 0) this.slowAll -= dt;
    this.movePlayer(dt, inp);
    this.director(dt);
    this.updateFoes(dt);
    this.updateShots(dt);
    this.updateAux(dt);
    this.updateZones(dt);
    this.updateSouls(dt);
    for (let i = this.timers.length - 1; i >= 0; i--) {
      const tm = this.timers[i];
      if (!tm) continue;
      if ((tm.t -= dt) <= 0) { this.timers[i] = this.timers[this.timers.length - 1]; this.timers.pop(); this.fire(tm); }
    }
    if (this.clearT > 0 && (this.clearT -= dt) <= 0) this.stageCleared();
    if (this.due > 0 && this.phase === 'play' && !this.clearT) this.rollChoices();
  }

  movePlayer(dt, inp) {
    const p = this.p, S = this.S;
    if (p.inv > 0) p.inv -= dt;
    if (p.slowT > 0) p.slowT -= dt;
    // dash charges come back one at a time
    if (p.dashN < S.dashMax) { p.dashT += dt; if (p.dashT >= S.dashCd) { p.dashT = 0; p.dashN++; } }
    if (S.shield && !p.shield) { p.shieldT += dt; if (p.shieldT >= S.shield) { p.shield = 1; p.shieldT = 0; this.ev.push({ t: 'shieldUp' }); } }
    let ix = inp.x || 0, iy = inp.y || 0;
    const il = hyp(ix, iy);
    if (il > 1) { ix /= il; iy /= il; }
    if (il > 0.05) { const n = hyp(ix, iy) || 1; p.dx = ix / n; p.dy = iy / n; }
    if (inp.dash && p.dashN > 0 && p.dash <= 0) {
      p.dashN--; p.dash = 0.2; p.inv = Math.max(p.inv, 0.32);
      p.ddx = p.dx; p.ddy = p.dy;
      this.ev.push({ t: 'dash', x: p.x, y: p.y });
    }
    if (p.dash > 0) {
      p.dash -= dt;
      const sp = S.speed * 3.1;
      p.vx = p.ddx * sp; p.vy = p.ddy * sp;
    } else {
      const sp = S.speed * (p.slowT > 0 ? 0.55 : 1), k = 1 - Math.exp(-dt * S.agil);
      p.vx += (ix * sp - p.vx) * k; p.vy += (iy * sp - p.vy) * k;
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const d = hyp(p.x, p.y), lim = this.arenaR - 16;
    if (d > lim) { p.x *= lim / d; p.y *= lim / d; }
    if (hyp(p.vx, p.vy) > 30) p.a = Math.atan2(p.vy, p.vx);
    // lay the trail
    const n = this.tx.length;
    if (!n) { this.tx.push(p.x); this.ty.push(p.y); return; }
    const lx = this.tx[n - 1], ly = this.ty[n - 1], seg = hyp(p.x - lx, p.y - ly);
    if (seg < 7) return;
    this.tx.push(p.x); this.ty.push(p.y); this.tl += seg;
    while (this.tl > S.trail && this.tx.length > 2) {
      this.tl -= hyp(this.tx[1] - this.tx[0], this.ty[1] - this.ty[0]);
      this.tx.shift(); this.ty.shift();
    }
    this.checkLoop();
  }

  // did the newest piece of the trail cross an older one?  if so the ground between becomes a seal
  checkLoop() {
    const tx = this.tx, ty = this.ty, n = tx.length;
    if (n < 6) return;
    const ax = tx[n - 2], ay = ty[n - 2], bx = tx[n - 1], by = ty[n - 1];
    for (let k = n - 5; k >= 0; k--) {
      let t = segHit(ax, ay, bx, by, tx[k], ty[k], tx[k + 1], ty[k + 1]);
      // a near miss closes the ring too: brushing the older stroke is enough
      if (t < 0 && k < n - 14 && (tx[k] - bx) * (tx[k] - bx) + (ty[k] - by) * (ty[k] - by) < 144) t = 1;
      if (t < 0) continue;
      const X = ax + (bx - ax) * t, Y = ay + (by - ay) * t;
      const poly = [X, Y];
      for (let i = k + 1; i <= n - 2; i++) poly.push(tx[i], ty[i]);
      if (poly.length < 8 || Math.abs(polyArea(poly)) < 700) return;
      if (!this.evo.mugen) {
        // the ring is spent: the stroke goes on from where it closed
        const hx = tx[n - 1], hy = ty[n - 1];
        tx.length = k + 1; ty.length = k + 1;
        tx.push(X, hx); ty.push(Y, hy);
        let l = 0;
        for (let i = 1; i < tx.length; i++) l += hyp(tx[i] - tx[i - 1], ty[i] - ty[i - 1]);
        this.tl = l;
      }
      this.seal(poly, 1, false);
      return;
    }
  }

  cutTrail(i, x, y) {
    // everything behind the cut is lost
    if (i <= 0 || i >= this.tx.length) return;
    this.tx.splice(0, i); this.ty.splice(0, i);
    let l = 0;
    for (let k = 1; k < this.tx.length; k++) l += hyp(this.tx[k] - this.tx[k - 1], this.ty[k] - this.ty[k - 1]);
    this.tl = l;
    this.ev.push({ t: 'cut', x, y });
  }
  clearTrail() { this.tx.length = 0; this.ty.length = 0; this.tl = 0; }

  // ---- 封: resolve a closed ring
  seal(poly, mul, echo) {
    const S = this.S, R = this.rel, foes = this.foes;
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity, cx = 0, cy = 0;
    for (let i = 0; i < poly.length; i += 2) { const x = poly[i], y = poly[i + 1]; cx += x; cy += y; if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y; }
    cx /= poly.length / 2; cy /= poly.length / 2;
    const area = Math.abs(polyArea(poly));
    const reach = Math.max(S.pull, S.frost, S.blast, S.chain ? 230 : 0) + 40;
    const inside = [], near = [];
    for (const e of foes) {
      if (e.dead || e.x < minx - reach || e.x > maxx + reach || e.y < miny - reach || e.y > maxy + reach) continue;
      const inPoly = pointInPoly(poly, e.x, e.y);
      const d = inPoly ? 0 : distToPoly(poly, e.x, e.y);
      if (inPoly || d < e.r * 0.5) { if (!e.fade) inside.push(e); } else { e._d = d; near.push(e); }
    }
    // 风: sweep the nearest ones in before the ring bites
    if (S.pull && !echo) {
      for (let i = near.length - 1; i >= 0; i--) {
        const e = near[i];
        if (e._d > S.pull || e.boss || e.fade) continue;
        for (let k = 0; k < 6 && !pointInPoly(poly, e.x, e.y); k++) { e.x = lerp(e.x, cx, 0.35); e.y = lerp(e.y, cy, 0.35); }
        inside.push(e); near[i] = near[near.length - 1]; near.pop();
      }
    }
    const n = inside.length;
    let dmg = S.power * mul * (1 + S.multi * Math.min(Math.max(0, n - 1), 24));
    const great = n >= 6 && S.great > 0;
    if (great) dmg *= S.great;
    if (!echo) {
      if (R.first && this.t - this.lastSeal > 4) dmg *= 2.5;
      if (R.tiny && area < 9000) dmg *= 2;
      if (R.huge) dmg *= 1 + Math.min(1.5, area / 100000);
      if (R.combo) { this.combo = this.t - this.lastSeal < 2.5 ? Math.min(5, this.combo + 1) : 0; dmg *= 1 + 0.2 * this.combo; }
      this.lastSeal = this.t;
      this.stats.seals++;
      if (n > this.stats.maxRing) this.stats.maxRing = n;
    }
    let kills = 0;
    const base = dmg;
    for (const e of inside) {
      let d = base;
      if (e.frozen > 0 && this.evo.zero) d *= 2;
      if (e.boss) d *= 1 + S.execBoss;
      this.hurt(e, d, 'seal');
      if (!e.dead && S.exec && !e.boss && e.hp < e.mhp * S.exec) this.kill(e, 'seal');
      if (e.dead) kills++;
    }
    // orbs caught in the ring are snuffed out (or turned back)
    let orbs = 0;
    for (let i = this.shots.length - 1; i >= 0; i--) {
      const b = this.shots[i];
      if (b.ally || b.x < minx || b.x > maxx || b.y < miny || b.y > maxy || !pointInPoly(poly, b.x, b.y)) continue;
      orbs++;
      if (R.mirror) { b.ally = 1; b.dmg = S.power; b.home = 1; b.life = 3; b.vx = -b.vx; b.vy = -b.vy; } else { this.shots[i] = this.shots[this.shots.length - 1]; this.shots.pop(); if (orbs % 3 === 0) this.dropSoul(b.x, b.y, 1); }
    }
    this.stats.orbs += orbs;
    if (n || orbs || !echo) this.ev.push({ t: 'seal', poly, n, kills, orbs, cx, cy, area, great, echo, dmg: base });
    if (n) {
      // 雷
      if (S.chain) {
        let src = 0;
        for (const e of inside) {
          if (src++ >= 10) break;
          let fx = e.x, fy = e.y;
          const used = [];
          for (let j = 0; j < S.chain * S.chainJump; j++) {
            let best = null, bd = 230 * 230;
            for (const q of near) { if (q.dead || q.fade || used.includes(q)) continue; const dd = (q.x - fx) * (q.x - fx) + (q.y - fy) * (q.y - fy); if (dd < bd) { bd = dd; best = q; } }
            if (!best) break;
            used.push(best);
            this.ev.push({ t: 'zap', x1: fx, y1: fy, x2: best.x, y2: best.y });
            this.hurt(best, base * S.chainMul, 'zap');
            if (S.chainJump > 1 && j % 2 === 0) { fx = best.x; fy = best.y; }
          }
          if (this.evo.tenbatsu && !echo) { this.ev.push({ t: 'bolt', x: e.x, y: e.y }); if (!e.dead) this.hurt(e, base * 0.6, 'bolt'); }
        }
      }
      // 缚灵
      if (S.wisp && kills) for (let k = 0; k < kills && this.allies.length < S.wispMax; k++) if (this.rng.chance(S.wisp)) this.allies.push({ x: cx + this.rng.range(-20, 20), y: cy + this.rng.range(-20, 20), vx: 0, vy: 0, life: this.evo.hyakki ? 1e9 : 9, tgt: null, rt: 0, dmg: 0.8 });
    }
    if (!echo) {
      // 冰 / 爆 reach outward from the ring
      if (S.frost) { let any = 0; for (const e of near) if (!e.dead && e._d < S.frost && !e.boss) { e.frozen = Math.max(e.frozen, S.frostDur); any = 1; } if (any || n) this.ev.push({ t: 'frost', poly, r: S.frost }); }
      if (S.blast) {
        for (const e of near) if (!e.dead && e._d < S.blast) { this.hurt(e, base * S.blastMul, 'blast'); if (!e.boss && !e.dead) { const dd = hyp(e.x - cx, e.y - cy) || 1; e.kx = ((e.x - cx) / dd) * 260; e.ky = ((e.y - cy) / dd) * 260; } }
        this.ev.push({ t: 'blast', poly, cx, cy, r: S.blast });
      }
      if (S.burn) this.zones.push({ poly, minx, miny, maxx, maxy, t: S.burnDur, dps: S.power * S.burn, tick: 0 });
      for (let k = 1; k <= S.echo; k++) this.timers.push({ t: 0.5 * k, f: 'echo', poly, mul: S.echoMul });
      if (R.slow && n >= 5) this.slowAll = 1.5;
    }
    return n;
  }

  fire(tm) {
    if (tm.f === 'echo') this.seal(tm.poly, tm.mul, true);
    else if (tm.f === 'boom') this.boom(tm.x, tm.y, tm.r, tm.dmg, !!tm.pl);
    else if (tm.f === 'spawn') this.addFoe(tm.k, tm.x, tm.y, tm.o);
  }
  boom(x, y, r, dmg, hurtsPlayer) {
    this.ev.push({ t: 'boom', x, y, r });
    for (const e of this.foes) if (!e.dead && !e.fade && hyp(e.x - x, e.y - y) < r + e.r) this.hurt(e, dmg, 'boom');
    if (hurtsPlayer && hyp(this.p.x - x, this.p.y - y) < r * 0.8) this.hitPlayer(x, y);
  }

  // ---- damage
  hurt(e, d, src) {
    if (e.dead || e.fade || d <= 0) return;
    const dot = src === 'burn' || src === 'ink';
    if (e.illu) { this.kill(e, src); return; }
    if (e.guard) d *= e.guard;
    if (e.boss && e.shielded) { if (!dot) this.ev.push({ t: 'block', x: e.x, y: e.y }); return; }
    e.hp -= d; if (!dot || e.fl <= 0) e.fl = dot ? 0.06 : 0.14;
    this.stats.dmg += d;
    if (e.real && src === 'seal') e.struck = 1;
    if (!dot && (e.boss || e.elite || e.part)) this.ev.push({ t: 'dmg', x: e.x, y: e.y - e.r, v: d, src, big: !!e.boss });
    if (e.hp <= 0) this.kill(e, src);
  }
  kill(e, src) {
    if (e.dead) return;
    e.dead = 1;
    const def = e.def;
    if (e.illu) { this.ev.push({ t: 'kill', x: e.x, y: e.y, r: e.r, col: def.col, k: e.k, illu: 1 }); if (src !== 'clear') for (let i = 0; i < 3; i++) this.timers.push({ t: 0.05 * i, f: 'spawn', k: 'foxfire', x: e.x + this.rng.range(-26, 26), y: e.y + this.rng.range(-26, 26) }); return; }
    this.stats.kills++; this.stats.score += Math.round(e.xp * 10 * (1 + 0.5 * this.stage));
    if (src === 'seal') {
      this.sealedKills++;
      if (this.rel.heal && ++this.healCount >= 70) { this.healCount = 0; this.heal(1); }
      if (this.rel.bomb) this.timers.push({ t: 0.08, f: 'boom', x: e.x, y: e.y, r: 70, dmg: this.S.power * 0.35 });
    }
    this.ev.push({ t: 'kill', x: e.x, y: e.y, r: e.r, col: def.col, k: e.k, elite: e.elite, boss: !!e.boss, src });
    if (!e.noDrop) {
      let v = e.xp;
      const n = Math.min(4, Math.max(1, Math.ceil(v / 2)));
      for (let i = 0; i < n; i++) this.dropSoul(e.x + this.rng.range(-e.r, e.r), e.y + this.rng.range(-e.r, e.r), v / n);
      if (this.p.hp < this.S.maxHp && this.rng.chance(e.elite ? 0.35 : 0.012)) this.souls.push({ x: e.x, y: e.y, vx: 0, vy: 0, v: 0, heart: 1, t: 0 });
    }
    if (def.split) for (let i = 0; i < 2; i++) this.timers.push({ t: 0.02, f: 'spawn', k: def.split, x: e.x + (i ? 14 : -14), y: e.y + this.rng.range(-8, 8) });
    if (def.boom) this.timers.push({ t: 0.32, f: 'boom', x: e.x, y: e.y, r: 78, dmg: 22 * STAGE_HP[this.stage % STAGES.length] * this.nm.hp, pl: 1 });
    if (e.boss) this.bossDied(e);
  }
  dropSoul(x, y, v) {
    if (this.souls.length > 420) { const s = this.souls[this.rng.int(this.souls.length)]; if (!s.heart) { s.v += v; return; } }
    const a = this.rng() * TAU, sp = this.rng.range(40, 150);
    this.souls.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, v, t: 0 });
  }
  heal(n) {
    const p = this.p;
    if (p.hp >= this.S.maxHp) return false;
    p.hp = Math.min(this.S.maxHp, p.hp + n);
    this.ev.push({ t: 'heal' });
    return true;
  }
  hitPlayer(x, y) {
    const p = this.p;
    if (p.inv > 0 || this.phase !== 'play') return false;
    if (p.shield) { p.shield = 0; p.shieldT = 0; p.inv = 0.7; this.ev.push({ t: 'shield', x: p.x, y: p.y }); this.shove(150, 0); return false; }
    p.hp--; p.inv = this.S.inv;
    this.stats.hits++; this.stats.stageHits++;
    this.clearTrail();
    this.shove(this.rel.thorn ? 230 : 150, this.rel.thorn ? this.S.power * 2 : 0);
    this.ev.push({ t: 'hurt', x: p.x, y: p.y, hp: p.hp });
    if (p.hp <= 0) {
      if (this.revives > 0 || this.rel.revive) {
        if (this.rel.revive) { delete this.rel.revive; p.hp = Math.min(2, this.S.maxHp); } else { this.revives--; p.hp = 1; }
        p.inv = 3; this.shove(320, this.S.power * 6);
        this.ev.push({ t: 'revive', x: p.x, y: p.y });
      } else { this.phase = 'dead'; this.ev.push({ t: 'dead', x: p.x, y: p.y }); }
    }
    return true;
  }
  // throw back what crowds the spirit (after a hit, so one touch never becomes three)
  shove(r, dmg) {
    const p = this.p;
    for (const e of this.foes) {
      if (e.dead || e.boss) continue;
      const d = hyp(e.x - p.x, e.y - p.y);
      if (d > r + e.r) continue;
      const k = 420 / (d || 1);
      e.kx = (e.x - p.x) * k; e.ky = (e.y - p.y) * k; e.stun = Math.max(e.stun, 0.5);
      if (dmg) this.hurt(e, dmg, 'thorn');
    }
    // orbs nearby are only marked: the list may be in the middle of being walked
    for (const b of this.shots) if (!b.ally && hyp(b.x - p.x, b.y - p.y) < r) b.life = 0;
  }

  // ---- souls and levels
  updateSouls(dt) {
    const p = this.p, m = this.S.magnet, all = this.clearT > 0;
    let got = 0;
    for (let i = this.souls.length - 1; i >= 0; i--) {
      const s = this.souls[i];
      s.t += dt;
      const dx = p.x - s.x, dy = p.y - s.y, d = hyp(dx, dy) || 1;
      if (all || s.pull || d < m) {
        s.pull = 1;
        const sp = Math.min(900, 260 + s.t * 500 + (all ? 500 : 0));
        s.vx = (dx / d) * sp; s.vy = (dy / d) * sp;
      } else { s.vx *= 0.9; s.vy *= 0.9; }
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (d < 20) {
        if (s.heart) { if (!this.heal(1)) this.xp += 3; } else { this.xp += s.v * this.S.xpMul; got++; }
        this.souls[i] = this.souls[this.souls.length - 1]; this.souls.pop();
      }
    }
    if (got) this.ev.push({ t: 'soul', n: got });
    while (this.xp >= this.need) { this.xp -= this.need; this.level++; this.need = xpNeed(this.level); this.due++; }
  }
  rollChoices() {
    const lv = (k) => this.lv[k] || 0;
    const owned = Object.keys(this.lv).length;
    const pool = TALI_IDS.filter((id) => !this.banned[id] && lv(id) < TALIS[id].max && (lv(id) > 0 || owned < 8));
    const out = [];
    for (const id of EVO_IDS) { const e = EVOS[id]; if (!this.evo[id] && lv(e.a) >= TALIS[e.a].max && lv(e.b) >= TALIS[e.b].max) { out.push({ k: 'evo', id }); break; } }
    while (out.length < 3 && pool.length) {
      const id = this.rng.weighted(pool, (q) => TALIS[q].w * (lv(q) > 0 ? 1.7 : 1));
      pool.splice(pool.indexOf(id), 1);
      out.push({ k: 'tali', id, to: lv(id) + 1 });
    }
    if (!out.length) out.push({ k: 'heal' });
    this.pending = { kind: 'level', choices: out };
    this.phase = 'choice';
    this.ev.push({ t: 'level', level: this.level });
  }
  rollRelics() {
    const pool = RELIC_IDS.filter((id) => !this.rel[id] && !this.relUsed[id]);
    this.rng.shuffle(pool);
    this.pending = { kind: 'relic', choices: pool.slice(0, 3).map((id) => ({ k: 'relic', id })) };
    this.phase = 'choice';
  }
  choose(i) {
    const pd = this.pending;
    if (!pd || !pd.choices[i]) return false;
    const c = pd.choices[i], p = this.p;
    if (c.k === 'tali') {
      this.lv[c.id] = c.to;
      if (c.id === 'vital') { this.recalc(); p.hp = Math.min(this.S.maxHp, p.hp + 1); }
    } else if (c.k === 'evo') this.evo[c.id] = 1;
    else if (c.k === 'heal') { if (!this.heal(1)) this.xp += this.need * 0.3; }
    else if (c.k === 'relic') { this.rel[c.id] = 1; this.relUsed[c.id] = 1; }
    this.recalc();
    if (p.hp > this.S.maxHp) p.hp = this.S.maxHp;
    if (this.S.shield && c.id === 'shield' && c.to === 1) p.shield = 1;
    this.pending = null; this.phase = 'play';
    this.ev.push({ t: 'took', c });
    if (pd.kind === 'level') { this.due--; p.inv = Math.max(p.inv, 0.6); if (this.due > 0) this.rollChoices(); } else this.nextStage();
    return true;
  }
  reroll() {
    if (!this.pending || this.pending.kind !== 'level' || this.rerolls <= 0) return false;
    this.rerolls--; this.rollChoices(); return true;
  }
  banish(i) {
    const pd = this.pending;
    if (!pd || pd.kind !== 'level' || this.banishes <= 0 || !pd.choices[i] || pd.choices[i].k !== 'tali') return false;
    this.banishes--; this.banned[pd.choices[i].id] = 1; this.rollChoices(); return true;
  }

  // ---- stages
  beginStage(i) {
    this.stage = i; this.stageT = 0; this.bossOn = false; this.boss = null; this.bossParts = null; this.arenaR = ARENA;
    this.relUsed = this.relUsed || {};
    const st = this.stageDef();
    this.wt = st.waves.map(() => 0.4);
    this.stats.stageHits = 0;
    this.ev.push({ t: 'stage', i, loop: this.loop });
  }
  stageDef() { return STAGES[this.stage % STAGES.length]; }
  hpMul() { return STAGE_HP[this.stage % STAGES.length] * this.nm.hp * (1 + 1.5 * this.loop); }
  bossDied(b) {
    this.stats.bosses++;
    this.stats.score += 500 * (this.stage + 1) * this.night;
    this.ev.push({ t: 'bossdie', x: b.x, y: b.y, k: b.k });
    this.boss = null; this.bossParts = null;
    // everything left of the parade is swept away
    for (const e of this.foes) if (!e.dead) { e.noDrop = e.xp < 2; this.kill(e, 'clear'); }
    for (const b of this.shots) b.life = 0;
    this.timers = this.timers.filter((tm) => tm.f === 'echo');
    this.clearT = 2.2;
  }
  stageCleared() {
    this.clearT = 0;
    this.ev.push({ t: 'clear', i: this.stage, flawless: this.stats.stageHits === 0 });
    if (this.stage % STAGES.length === STAGES.length - 1 && !this.endless) { this.phase = 'won'; this.ev.push({ t: 'won' }); return; }
    this.rollRelics();
    if (!this.pending.choices.length) { this.pending = null; this.phase = 'play'; this.nextStage(); }
  }
  nextStage() {
    this.foes.length = 0; this.shots.length = 0; this.zones.length = 0; this.timers.length = 0;
    this.clearTrail();
    this.heal(1);
    if ((this.stage + 1) % STAGES.length === 0) this.loop++;
    this.beginStage(this.stage + 1);
    this.p.inv = 1.5;
  }
  // after the final night is survived the parade may go round again, harder each time
  goEndless() { if (this.phase !== 'won') return; this.endless = true; this.phase = 'play'; this.rollRelics(); if (!this.pending.choices.length) { this.pending = null; this.phase = 'play'; this.nextStage(); } }

  // ---- checkpoint: a run can be picked up again from the start of its current stage
  checkpoint() {
    return { v: 1, seed: this.seed, rs: this.rng.get(), hero: this.heroId, night: this.night, daily: this.daily, stage: this.stage, loop: this.loop, endless: this.endless, t: this.t,
      lv: this.lv, evo: this.evo, rel: this.rel, relUsed: this.relUsed, banned: this.banned, rerolls: this.rerolls, banishes: this.banishes, revives: this.revives,
      level: this.level, xp: this.xp, due: this.due, hp: this.p.hp, stats: this.stats, healCount: this.healCount };
  }
  restore(s) {
    this.rng.set(s.rs); this.loop = s.loop || 0; this.endless = !!s.endless; this.t = s.t || 0;
    this.lv = Object.assign({}, s.lv); this.evo = Object.assign({}, s.evo); this.rel = Object.assign({}, s.rel); this.relUsed = Object.assign({}, s.relUsed); this.banned = Object.assign({}, s.banned);
    this.rerolls = s.rerolls | 0; this.banishes = s.banishes | 0; this.revives = s.revives | 0;
    this.level = Math.max(1, s.level | 0); this.xp = +s.xp || 0; this.need = xpNeed(this.level); this.due = s.due | 0;
    this.stats = Object.assign(this.stats, s.stats); this.healCount = s.healCount | 0;
    this.recalc();
    this.p.hp = clamp(s.hp | 0, 1, this.S.maxHp);
    this.p.shield = this.S.shield ? 1 : 0;
  }
}

// ---------- the simulation, second half: the parade, its behaviours, the bosses, and the helpers that fight beside you ----------
const CELL = 72;
const cellKey = (x, y) => (Math.floor(x / CELL) + 512) * 1024 + Math.floor(y / CELL) + 512;

Object.assign(World.prototype, {
  addFoe(k, x, y, o) {
    const bdef = BOSSES[k], def = bdef || FOES[k];
    const m = bdef ? this.nm.hp * (1 + 1.5 * this.loop) : this.hpMul();
    const e = { k, def, x, y, vx: 0, vy: 0, kx: 0, ky: 0, r: def.r, hp: def.hp * m, mhp: 0, spd: def.spd * this.nm.spd, xp: def.xp, t: 0, s: 0, st: this.rng.range(0.6, 2.4), a: 0, ph: this.rng() * TAU,
      fl: 0, frozen: 0, stun: 0, fade: 0, dead: 0, elite: 0, boss: bdef ? 1 : 0, wcd: 0, tcd: 0, haste: 0, lx: 0, ly: 0, tele: 0 };
    if (o) Object.assign(e, o);
    if (e.elite) { e.r *= 1.45; e.hp *= 5; e.xp *= 6; }
    e.mhp = e.hp;
    this.foes.push(e);
    return e;
  },
  shoot(x, y, ang, sp, o) {
    const b = { x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 6, life: 7, ally: 0 };
    if (o) Object.assign(b, o);
    this.shots.push(b);
    return b;
  },
  nearestFoe(x, y, maxD, skip) {
    let best = null, bd = maxD * maxD;
    for (const e of this.foes) { if (e.dead || e.fade || e === skip) continue; const d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y); if (d < bd) { bd = d; best = e; } }
    return best;
  },

  // ---- who comes, and when
  director(dt) {
    const st = this.stageDef(), T = this.stageT, cap = 230 + 22 * this.night;
    if (this.clearT > 0 || this.quiet) return;
    // the first stage of a night opens gently
    const ease = this.stage === 0 && !this.loop ? 0.55 + 0.45 * Math.min(1, T / 70) : 1;
    const rate = this.nm.rate * (this.bossOn ? 0.45 : 1) * (1 + 0.4 * this.loop) * ease;
    for (let j = 0; j < st.waves.length; j++) {
      const w = st.waves[j];
      if (T < w[0] || (this.bossOn && j > 1)) continue;
      if ((this.wt[j] -= dt * rate) > 0) continue;
      this.wt[j] = w[2] * this.rng.range(0.85, 1.15);
      if (this.foes.length < cap || w[5]) this.spawnPack(w[3], w[4], w[5]);
    }
    if (!this.bossOn && T >= st.dur) this.spawnBoss();
  },
  spawnPoint() {
    const p = this.p, a = this.rng() * TAU, lim = this.arenaR + 200;
    let x = p.x + Math.cos(a) * SPAWN_R, y = p.y + Math.sin(a) * SPAWN_R, d = hyp(x, y);
    if (d > lim) { x *= lim / d; y *= lim / d; }
    if (hyp(x - p.x, y - p.y) < 560) { x = p.x - Math.cos(a) * SPAWN_R; y = p.y - Math.sin(a) * SPAWN_R; d = hyp(x, y); if (d > lim) { x *= lim / d; y *= lim / d; } }
    return { x, y, a };
  },
  spawnPack(k, n, elite) {
    const s = this.spawnPoint(), def = FOES[k], rng = this.rng;
    if (elite) { for (let i = 0; i < n; i++) this.addFoe(k, s.x + rng.range(-30, 30), s.y + rng.range(-30, 30), { elite: 1 }); this.ev.push({ t: 'elite', x: s.x, y: s.y }); return; }
    const cnt = Math.max(1, Math.round(n * rng.range(0.8, 1.2)));
    const lucky = rng.chance(this.nm.elite) ? rng.int(cnt) : -1;
    for (let i = 0; i < cnt; i++) {
      let x, y;
      if (def.ai === 'zig') { x = s.x + Math.cos(s.a) * i * 24; y = s.y + Math.sin(s.a) * i * 24; } else { const q = rng() * TAU, rr = Math.sqrt(rng()) * 15 * Math.sqrt(cnt); x = s.x + Math.cos(q) * rr; y = s.y + Math.sin(q) * rr; }
      this.addFoe(k, x, y, i === lucky ? { elite: 1 } : null);
    }
  },

  buildGrid() {
    const g = this._g || (this._g = new Map()), used = this._gu || (this._gu = []);
    for (const a of used) a.length = 0;
    used.length = 0;
    for (const e of this.foes) {
      if (e.dead) continue;
      const key = cellKey(e.x, e.y);
      let a = g.get(key);
      if (!a) g.set(key, a = []);
      if (!a.length) used.push(a);
      a.push(e);
    }
    return g;
  },
  // which trail points lie in which cell (only built when something needs to know)
  buildTrailGrid() {

  updateShots(dt) {

  shikiPos(i, out) { const n = this.S.shiki, a = this.t * 1.7 + (i * TAU) / n; out.x = this.p.x + Math.cos(a) * 44; out.y = this.p.y + Math.sin(a) * 44 * 0.8 - 6; return out; },

  hyakume(w, e, dt, slow) {

  mukade(w, e, dt, slow) {

// ---------- what outlives a run: settings, jade, the shrine, unlocked spirits, feats ----------
const SAVE_KEY = 'nightbind.save.v1';
const DEFAULT_SETTINGS = { lang: 'zh', music: 0.6, sfx: 0.8, shake: true, reduce: false, dmg: true, haptics: true, quality: 0 };
function freshProfile() {
  return { v: 1, settings: Object.assign({}, DEFAULT_SETTINGS), run: null,
    meta: { jade: 0, shrine: {}, heroes: { fox: 1 }, nights: {}, seen: {}, ach: {}, daily: {}, tutorial: 0, hero: 'fox', night: 1,
      stats: { runs: 0, wins: 0, kills: 0, seals: 0, orbs: 0, time: 0, bestRing: 0, bestScore: 0, bosses: 0 } } };

  if (!HEROES[m.hero] || !m.heroes[m.hero]) m.hero = 'fox';
  m.night = clamp(m.night | 0 || 1, 1, NIGHT_MAX);

  const r = p.run;
  const good = r && r.v === 1 && typeof r.seed === 'string' && /^[A-Z0-9-]{1,24}$/.test(r.seed) && HEROES[r.hero] && Number.isInteger(r.stage) && r.stage >= 0 && r.stage < 500 && r.lv && typeof r.lv === 'object'

}
function loadProfile() {
  const saved = Store.read();

    try {
      const l = (navigator.language || 'zh').toLowerCase();
      PROFILE.settings.lang = l.startsWith('zh') ? 'zh' : 'en';
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) PROFILE.settings.reduce = true;
    } catch (e) { /* keep the defaults */ }

}
let _saveTimer = 0;
function saveProfile(now) {

  if (_saveTimer) return;
  _saveTimer = setTimeout(() => { _saveTimer = 0; Store.write(PROFILE); }, 300);
}

function importProfile(str) {
  try {

    const text = decodeURIComponent(escape(atob(s.slice(4))));

  sprV: `attribute vec2 aPos; attribute vec2 aUv; attribute vec4 aCol; uniform vec4 uView; varying vec2 vUv; varying vec4 vCol;
void main(){ vUv = aUv; vCol = aCol; gl_Position = vec4(aPos * uView.xy + uView.zw, 0.0, 1.0); }`,
  sprF: `precision mediump float; uniform sampler2D uTex; varying vec2 vUv; varying vec4 vCol;
void main(){ vec4 t = texture2D(uTex, vUv); gl_FragColor = vec4(t.rgb * vCol.rgb, t.a * vCol.a); }`,
  fullV: `attribute vec2 aPos; varying vec2 vUv; void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`,

  // the ground of the night: mist, a faint ritual pattern, the warded edge
  bgF: `precision highp float;
uniform vec2 uRes; uniform vec2 uCam; uniform float uZoom; uniform float uTime; uniform vec3 uHue; uniform float uArena; uniform vec2 uPl; uniform float uDark;
varying vec2 vUv;
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * noise(p); p = p * 2.03 + vec2(17.0, 9.0); a *= 0.5; } return s; }
void main(){
  vec2 wp = (gl_FragCoord.xy - uRes * 0.5) / uZoom * vec2(1.0, -1.0) + uCam;
  float r = length(wp);
  float t = uTime;
  // drifting mist in two layers
  float m1 = fbm(wp * 0.0017 + vec2(t * 0.011, -t * 0.007));
  float m2 = fbm(wp * 0.0046 - vec2(t * 0.02, t * 0.013) + m1 * 1.4);
  vec3 base = uHue * 0.30 + vec3(0.02, 0.024, 0.045);
  vec3 col = base * (0.5 + 1.1 * m1) + uHue * 0.42 * pow(m2, 2.0);
  // the ritual ground: rings and spokes, very faint, breathing
  float ring = abs(fract(r / 220.0 - 0.5) - 0.5) * 220.0;
  float ang = atan(wp.y, wp.x);
  float spoke = abs(fract(ang / 6.2831853 * 12.0 - 0.5) - 0.5) * r * 0.5236;
  float lines = smoothstep(2.2, 0.0, ring) * 0.55 + smoothstep(1.8, 0.0, spoke) * 0.4 * smoothstep(120.0, 320.0, r);
  // small tiles like worn paving
  vec2 gq = abs(fract(wp / 72.0) - 0.5) * 72.0;
  float tile = smoothstep(1.4, 0.0, min(gq.x, gq.y)) * 0.18;
  float breathe = 0.75 + 0.25 * sin(t * 0.6 + r * 0.004);
  col += (uHue * 0.7 + 0.16) * (lines * breathe + tile) * 0.42;
  // motes
  vec2 sp = wp * 0.02 + vec2(t * 0.05, t * 0.03); vec2 si = floor(sp); float sh = hash(si);
  float star = smoothstep(0.06, 0.0, length(fract(sp) - 0.5 - (vec2(hash(si + 3.1), hash(si + 7.7)) - 0.5) * 0.7)) * step(0.86, sh);
  col += vec3(0.7, 0.8, 1.0) * star * (0.3 + 0.3 * sin(t * 2.0 + sh * 40.0));
  // light the spirit carries
  float pl = exp(-length(wp - uPl) / 300.0);
  col += (uHue * 0.6 + vec3(0.04, 0.06, 0.09)) * pl * 0.9;
  // the warded edge: a rope of light, and the dark beyond it
  float e = r - uArena;
  float rope = exp(-abs(e) * 0.22) * (0.7 + 0.3 * sin(ang * 420.0 + t * 2.0)) + exp(-abs(e) * 0.035) * 0.28;
  col += vec3(1.0, 0.36, 0.22) * rope * 0.95;
  float outF = smoothstep(0.0, 260.0, e);
  col = mix(col, vec3(0.012, 0.004, 0.012) + vec3(0.10, 0.02, 0.04) * fbm(wp * 0.004 + t * 0.03), outF * 0.92);
  col *= 1.0 - uDark * 0.6;
  gl_FragColor = vec4(col, 1.0);
}`,

  blurF: `precision mediump float; uniform sampler2D uTex; uniform vec2 uDir; uniform float uCut; varying vec2 vUv;
void main(){

  c += (texture2D(uTex, vUv + uDir * 1.3846).rgb + texture2D(uTex, vUv - uDir * 1.3846).rgb) * 0.316216;

  postF: `precision highp float;
uniform sampler2D uScene; uniform sampler2D uB1; uniform sampler2D uB2; uniform vec2 uRes; uniform float uTime; uniform float uFlash; uniform float uHurt; uniform float uChroma; uniform vec4 uRip[6]; uniform float uGrain; uniform float uFade;

  c *= uFade;
  gl_FragColor = vec4(c, 1.0);
}`,

// ear clipping, for filling the ring a stroke encloses
function triangulate(p) {
  const n = p.length >> 1, out = [];
  if (n < 3) return out;
  const V = new Array(n);
  if (polyArea(p) > 0) for (let i = 0; i < n; i++) V[i] = i; else for (let i = 0; i < n; i++) V[i] = n - 1 - i;
  let nv = n, count = 2 * nv;
  for (let v = nv - 1; nv > 2;) {
    if (count-- <= 0) break;
    let u = v; if (nv <= u) u = 0;
    v = u + 1; if (nv <= v) v = 0;
    let w = v + 1; if (nv <= w) w = 0;
    const ax = p[V[u] * 2], ay = p[V[u] * 2 + 1], bx = p[V[v] * 2], by = p[V[v] * 2 + 1], cx = p[V[w] * 2], cy = p[V[w] * 2 + 1];
    let ear = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax) > 1e-9;
    for (let k = 0; ear && k < nv; k++) {
      if (k === u || k === v || k === w) continue;
      const px = p[V[k] * 2], py = p[V[k] * 2 + 1];
      const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by), d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy), d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
      if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) ear = false;
    }
    if (ear) { out.push(V[u], V[v], V[w]); for (let s = v, t = v + 1; t < nv; s++, t++) V[s] = V[t]; nv--; count = 2 * nv; }
  }

}
function thin(poly, max) {
  const n = poly.length >> 1;
  if (n <= max) return poly;
  const step = Math.ceil(n / max), out = [];
  for (let i = 0; i < n; i += step) out.push(poly[i * 2], poly[i * 2 + 1]);
  return out;
}

// ---------- what stays on screen during the fight ----------
const Hud = {
  el: {}, c: {},
  build() {
    const r = clear($('#hud')), E = this.el = {};
    r.append(
      h('div.xp', E.xp = h('i')),
      h('div.tl', E.lv = h('div.lv'), E.hearts = h('div.hearts')),
      h('div.tc', E.stage = h('div.stg'), E.timer = h('div.tm'), E.boss = h('div.bossbar', E.bossN = h('span'), h('div', E.bossF = h('i')))),
      h('div.tr', E.kills = h('div.kl'), E.pause = h('button.pausebtn', { type: 'button', 'aria-label': 'pause', html: '<i></i><i></i>', on: { click: () => UI.pause() } })),
      E.strip = h('div.strip'),
      E.dash = h('button.dashbtn', { type: 'button', 'aria-label': 'dash', text: '瞬' }),
      E.banner = h('div.banner'), E.hint = h('div.hint'), E.stick = h('div.stick', h('i')));
    E.dash.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); App.dashQ = true; });
    this.c = {};
  },
  show(v) { $('#hud').classList.toggle('on', !!v); },
  set(key, val, fn) { if (this.c[key] !== val) { this.c[key] = val; fn(val); } },
  update(w) {
    const E = this.el, p = w.p, S = w.S;
    this.set('xp', Math.round((1000 * w.xp) / w.need), (v) => { E.xp.style.width = v / 10 + '%'; });
    this.set('lv', w.level, (v) => { E.lv.textContent = T('hud.lv') + ' ' + v; });
    this.set('hp', p.hp + '/' + S.maxHp + '/' + p.shield, () => { let s = ''; for (let i = 0; i < S.maxHp; i++) s += `<i class="${i < p.hp ? 'on' : ''}"></i>`; if (S.shield) s += `<b class="${p.shield ? 'on' : ''}"></b>`; E.hearts.innerHTML = s; });
    this.set('stage', w.stage + ':' + w.loop + LANG, () => { E.stage.textContent = nm(w.stageDef()) + (w.loop ? ' · ' + T('hud.loop', w.loop + 1) : ''); });
    const boss = w.boss;
    this.set('bossOn', boss ? boss.k : '', (k) => { E.boss.classList.toggle('on', !!k); E.timer.classList.toggle('off', !!k); if (k) E.bossN.textContent = nm(BOSSES[k]); });
    if (boss) this.set('bossHp', Math.round(w.bossHp() * 200), (v) => { E.bossF.style.width = v / 2 + '%'; });
    else this.set('time', Math.max(0, Math.ceil(w.stageDef().dur - w.stageT)), (v) => { E.timer.textContent = fmtTime(v); E.timer.classList.toggle('soon', v <= 10); });
    this.set('kills', w.stats.kills, (v) => { E.kills.textContent = fmtNum(v); });
    this.set('build', Object.keys(w.lv).map((k) => k + w.lv[k]).join() + '|' + Object.keys(w.evo).join() + '|' + Object.keys(w.rel).join(), () => {
      clear(E.strip);
      for (const id of Object.keys(w.lv)) { const d = TALIS[id], e = emblem(d.g, d.kind, 'sm'); e.appendChild(h('em', { text: w.lv[id] >= d.max ? '★' : String(w.lv[id]) })); E.strip.appendChild(e); }
      for (const id of Object.keys(w.evo)) E.strip.appendChild(emblem(EVOS[id].g, 'evo', 'sm'));
      for (const id of Object.keys(w.rel)) E.strip.appendChild(emblem(RELICS[id].g, 'relic', 'sm'));
    });
    this.set('dash', p.dashN > 0 ? 100 : Math.round((100 * p.dashT) / S.dashCd), (v) => { E.dash.style.setProperty('--cd', v + '%'); E.dash.classList.toggle('ready', v >= 100); });
  },
  banner(main, sub, cls) {
    const E = this.el;
    E.banner.className = 'banner';
    void E.banner.offsetWidth;
    E.banner.innerHTML = `<div class="b1">${main}</div>${sub ? `<div class="b2">${sub}</div>` : ''}`;
    E.banner.className = 'banner go ' + (cls || '');
  },
  hint(text) { const E = this.el; if (!text) { E.hint.classList.remove('on'); return; } E.hint.textContent = text; E.hint.classList.add('on'); },
  stick(s) {
    const E = this.el;
    if (!s) { E.stick.classList.remove('on'); return; }
    E.stick.classList.add('on');
    E.stick.style.transform = `translate(${s.ox}px, ${s.oy}px)`;
    E.stick.firstChild.style.transform = `translate(${clamp(s.x - s.ox, -56, 56)}px, ${clamp(s.y - s.oy, -56, 56)}px)`;
  },

// ---------- boot, the frame loop, input, and the flow between screens ----------
const App = {
  w: null, mode: 'title', demo: false, acc: 0, last: 0, keys: {}, ptr: { x: 0, y: 0, mouse: false }, stick: null, dashQ: false, inp: { x: 0, y: 0, dash: false }, q: { x: 0, y: 0 },
  touch: false, scale: 1, slow: 0, tutT: 0, endT: 0, bot: { hold: 0, cx: 0, cy: 0, r: 70, dir: 1, tgt: null },

  boot() {
    loadProfile();
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    const cv = document.getElementById('gl');
    this.glOk = Render.init(cv);
    Hud.build();
    this.motion();
    this.resize();
    try { this.touch = window.matchMedia('(pointer: coarse)').matches; } catch (e) { this.touch = false; }
    document.body.classList.toggle('touch', this.touch);
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 150));
    window.addEventListener('keydown', (e) => this.key(e, true));
    window.addEventListener('keyup', (e) => this.key(e, false));
    window.addEventListener('blur', () => { this.keys = {}; this.stick = null; Hud.stick(null); });
    cv.addEventListener('pointerdown', (e) => this.pdown(e));
    window.addEventListener('pointermove', (e) => this.pmove(e));
    window.addEventListener('pointerup', (e) => this.pup(e));
    window.addEventListener('pointercancel', (e) => this.pup(e));
    document.addEventListener('contextmenu', (e) => { if (!(e.target instanceof HTMLTextAreaElement)) e.preventDefault(); });
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, () => Snd.resume(), true);
    document.addEventListener('click', (e) => { const b = e.detail > 0 && e.target instanceof Element ? e.target.closest('button') : null; if (b) b.blur(); }, true);
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (this.mode === 'play' && !this.demo) UI.pause(); saveProfile(true); Snd.suspend(); } else { this.last = nowMs(); Snd.resume(); } });
    window.addEventListener('pagehide', () => saveProfile(true));
    window.addEventListener('error', (e) => this.oops(e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => this.oops(e.reason));
    if (!this.glOk) { UI.screen(h('div.page', h('div.nogl', { text: T('nogl') }))); }
    else this.toTitle();
    const boot = document.getElementById('boot');
    requestAnimationFrame(() => requestAnimationFrame(() => { boot.classList.add('gone'); setTimeout(() => boot.remove(), 700); }));
    this.last = nowMs();
    requestAnimationFrame((t) => this.loop(t));
  },
  _oops: 0,
  oops(err) { if (typeof console !== 'undefined') console.error(err); if (this._oops++ < 2) { try { UI.toast({ icon: '误', title: T('oops'), text: escHtml(String(err && err.message ? err.message : err)).slice(0, 100) }); } catch (e) { /* ignore */ } } },
  motion() { document.body.classList.toggle('calm', !!PROFILE.settings.reduce); },
  fullscreen() { const d = document, el = d.documentElement; try { if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) { /* not available */ } },
  relang() {
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    Hud.build();
    if (this.demo || this.mode === 'title') UI.title(); else if (this.mode === 'choice') UI.choice(this.w); else if (this.mode === 'end') this.toTitle();
  },
  resize() {
    if (!this.glOk) return;
    const q = PROFILE.settings.quality;
    const dpr = Math.min(q === 2 ? 1 : 2, window.devicePixelRatio || 1);
    GL.resize(window.innerWidth, window.innerHeight, dpr, q === 2 ? 0.8 : this.scale);
  },

  // ---- flow
  toTitle() {
    UI.closeAll();
    this.mode = 'title'; this.demo = true;
    this.w = new World({ seed: makeSeed(), hero: PROFILE.meta.hero, night: 1 });
    FX.clear(); Render.snap(this.w);
    Hud.show(false); Hud.hint(''); Hud.stick(null);
    Snd.setMusic('title');
    UI.title();
  },
  begin(o) {
    UI.closeAll(); UI.screen(null);
    this.demo = false;
    this.w = new World(Object.assign({ boons: PROFILE.meta.shrine }, o));
    this.enter();
  },
  resume() {
    const s = PROFILE.run;
    if (!s) return;
    UI.closeAll(); UI.screen(null);
    this.demo = false;
    try { this.w = new World({ seed: s.seed, hero: s.hero, night: s.night, daily: s.daily, boons: PROFILE.meta.shrine, stage: s.stage, save: s }); } catch (e) { PROFILE.run = null; saveProfile(true); this.toTitle(); return; }
    this.enter();
  },
  enter() {
    this.mode = 'play'; this.acc = 0; this.endT = 0; this.keys = {}; this.stick = null; this.dashQ = false;
    FX.clear(); Render.snap(this.w);
    Hud.c = {}; Hud.show(true); Hud.update(this.w);
    this.tutT = 0;
    this.drain();
    this.last = nowMs();
  },
  choose(i) {
    const w = this.w;
    if (!w.choose(i)) return;
    this.drain();
    if (w.phase === 'choice') UI.choice(w); else { UI.screen(null); this.mode = 'play'; this.last = nowMs(); }
  },
  finish(won) {
    const w = this.w;
    this.mode = 'end';
    Hud.show(false); Hud.hint(''); Hud.stick(null);
    const r = settleRun(w, won);
    Snd.setMusic(won ? 'won' : 'dead');
    UI.results(r, w);
    if (r.ach.length || r.heroes.length) Snd.play('ach');
  },
  endless() { const w = this.w; UI.screen(null); w.goEndless(); Hud.show(true); this.mode = 'play'; this.endT = 0; this.drain(); if (w.phase === 'choice') { this.mode = 'choice'; UI.choice(w); } this.last = nowMs(); },

  // ---- input
  key(e, down) {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (down && e.repeat) { if (k === ' ' || k.startsWith('Arrow')) e.preventDefault(); return; }
    if (down && k === 'Escape') { e.preventDefault(); if (UI.open()) UI.closeTop(); else if (this.mode === 'play' && !this.demo) UI.pause(); return; }
    if (UI.open()) return;
    if (this.mode === 'choice') { if (down && k >= '1' && k <= '3' && UI._pick) UI._pick(+k - 1); return; }
    if (this.mode !== 'play' || this.demo) return;
    this.keys[k] = down;
    if (down && (k === ' ' || k === 'Shift')) this.dashQ = true;
    if (down && k === 'p') UI.pause();
    if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
    if (down && 'wasd'.includes(k) || k.startsWith('Arrow')) this.ptr.mouse = false;
  },
  pdown(e) {
    if (this.mode !== 'play' || this.demo) return;
    if (e.pointerType === 'mouse') { this.ptr.mouse = true; this.ptr.x = e.clientX; this.ptr.y = e.clientY; this.dashQ = true; return; }
    this.touch = true;
    if (!this.stick) { this.stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY }; Hud.stick(this.stick); }
    else this.dashQ = true;
  },
  pmove(e) {
    if (e.pointerType === 'mouse') { this.ptr.mouse = true; this.ptr.x = e.clientX; this.ptr.y = e.clientY; return; }
    const s = this.stick;
    if (s && s.id === e.pointerId) { s.x = e.clientX; s.y = e.clientY; const dx = s.x - s.ox, dy = s.y - s.oy, d = hyp(dx, dy); if (d > 72) { s.ox = s.x - (dx / d) * 72; s.oy = s.y - (dy / d) * 72; } Hud.stick(s); }
  },
  pup(e) { if (this.stick && this.stick.id === e.pointerId) { this.stick = null; Hud.stick(null); } },
  input() {
    const k = this.keys, inp = this.inp, w = this.w;
    let x = (k.d || k.ArrowRight ? 1 : 0) - (k.a || k.ArrowLeft ? 1 : 0), y = (k.s || k.ArrowDown ? 1 : 0) - (k.w || k.ArrowUp ? 1 : 0);
    if (x || y) { const l = hyp(x, y); x /= l; y /= l; }
    else if (this.stick) { const s = this.stick; x = (s.x - s.ox) / 52; y = (s.y - s.oy) / 52; const l = hyp(x, y); if (l > 1) { x /= l; y /= l; } else if (l < 0.14) { x = 0; y = 0; } }
    else if (this.ptr.mouse) {
      const q = Render.toWorld(this.ptr.x, this.ptr.y, this.q), dx = q.x - w.p.x, dy = q.y - w.p.y, d = hyp(dx, dy), m = clamp((d - 8) / 40, 0, 1);
      x = d > 0 ? (dx / d) * m : 0; y = d > 0 ? (dy / d) * m : 0;
    }
    inp.x = x; inp.y = y; inp.dash = this.dashQ; this.dashQ = false;
    return inp;
  },
  // the hands-off pilot that plays behind the title
  autopilot() {
    const w = this.w, p = w.p, b = this.bot, inp = this.inp;
    if ((b.hold -= STEP) <= 0 || !b.tgt || b.tgt.dead) {
      b.hold = 1.3; b.tgt = w.nearestFoe(p.x, p.y, 900);
      if (b.tgt) { let far = 0; for (const e of w.foes) { const d = hyp(e.x - b.tgt.x, e.y - b.tgt.y); if (d < 100 && d + e.r > far) far = d + e.r; } b.cx = b.tgt.x; b.cy = b.tgt.y; b.r = Math.min(Math.max(52, far + 34), (w.S.trail / TAU) * 0.88); if (Math.random() < 0.3) b.dir = -b.dir; }
    }
    let ix = -p.x, iy = -p.y;
    if (b.tgt && !b.tgt.dead) { b.cx += (b.tgt.x - b.cx) * 0.02; b.cy += (b.tgt.y - b.cy) * 0.02; const dx = p.x - b.cx, dy = p.y - b.cy, d = hyp(dx, dy) || 1, rad = clamp((b.r - d) / 40, -1, 1); ix = (-dy / d) * b.dir + (dx / d) * rad; iy = (dx / d) * b.dir + (dy / d) * rad; }
    for (const e of w.foes) { const dx = p.x - e.x, dy = p.y - e.y, d = hyp(dx, dy) - e.r; if (d < 34) { ix += (dx / (d + e.r + 1)) * 2; iy += (dy / (d + e.r + 1)) * 2; } }
    const l = hyp(ix, iy) || 1;
    inp.x = ix / l; inp.y = iy / l; inp.dash = false;
    return inp;
  },

  loop(now) {
    requestAnimationFrame((t) => this.loop(t));
    const raw = (now - this.last) / 1000, dt = Math.min(0.05, Math.max(0, raw));
    this.last = now;
    const w = this.w;
    if (!w || !this.glOk) return;
    // if frames keep coming slowly, draw fewer pixels
    if (PROFILE.settings.quality === 0 && (this.mode === 'play' || this.demo)) { this.slow = raw > 0.024 ? this.slow + raw : Math.max(0, this.slow - raw * 0.5); if (this.slow > 2.5 && this.scale > 0.55) { this.scale = this.scale > 0.8 ? 0.75 : 0.55; this.slow = 0; this.resize(); } }
    const running = (this.mode === 'play' || this.demo) && !UI.open();
    if (running && w.phase === 'play') {
      if (FX.hitstop > 0) FX.hitstop -= dt;
      else {
        let ts = 1;
        if (FX.slowmo > 0) { FX.slowmo -= dt; ts = 0.3; }
        const fast = this.speed || 1;                 // (only the test harness sets a speed)
        this.acc += dt * ts * fast;
        let guard = 0;
        while (this.acc >= STEP && guard++ < 5 * fast) { this.acc -= STEP; w.step(this.demo ? this.autopilot() : this.input()); this.drain(); if (w.phase !== 'play') break; }
        if (guard >= 5 * fast) this.acc = 0;
      }
    }
    if (this.demo) {
      if (w.phase === 'choice') w.choose((Math.random() * w.pending.choices.length) | 0);
      if (w.p.hp < w.S.maxHp) w.p.hp = w.S.maxHp;
      if (w.phase !== 'play' && w.phase !== 'choice' || w.stage > 0) this.w = new World({ seed: makeSeed(), hero: PROFILE.meta.hero, night: 1 });
      Render.fade += (0.5 - Render.fade) * 0.06;
    } else {
      Render.fade += (1 - Render.fade) * 0.1;
      if (this.mode === 'play') {
        if (w.phase === 'choice') { this.mode = 'choice'; this.keys = {}; this.stick = null; Hud.stick(null); UI.choice(w); }
        else if (w.phase === 'dead' || w.phase === 'won') { if ((this.endT += dt) > (w.phase === 'won' ? 1.4 : 1.9)) this.finish(w.phase === 'won'); }
        Hud.update(w);
        this.tutor(dt);
      }
    }
    Render.dark += ((this.mode === 'choice' || this.mode === 'paused' ? 0.75 : 0) - Render.dark) * 0.15;
    if (this._dim !== (this.mode === 'choice')) { this._dim = this.mode === 'choice'; $('#hud').classList.toggle('dim', this._dim); }
    FX.update(dt);
    Render.frame(this.w, dt);
  },
  drain() {
    const w = this.w, ev = w.ev, m = PROFILE.meta, demo = this.demo;
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i];
      FX.on(e, w);
      if (demo) continue;
      Snd.on(e, w);
      switch (e.t) {
        case 'stage': PROFILE.run = w.checkpoint(); saveProfile(true); Hud.banner(T('ban.stage', LANG === 'zh' ? T('num.' + ((e.i % 5) + 1)) : (e.i % 5) + 1), nm(w.stageDef()), ''); break;
        case 'boss': Hud.banner(T('ban.boss'), nm(BOSSES[e.k]), 'boss'); this.buzz(60); break;
        case 'kill': if (!m.seen['f_' + e.k] && FOES[e.k] && !FOES[e.k].hidden) m.seen['f_' + e.k] = 1; break;
        case 'bossdie': m.seen['b_' + e.k] = 1; this.buzz([40, 40, 80]); break;
        case 'clear': if (e.flawless) w.flawlessAny = 1; Hud.banner(T('ban.clear'), e.flawless ? T('ban.flawless') : '', 'clear'); break;
        case 'hurt': this.buzz(90); break;
        case 'seal': if (e.kills >= 6) this.buzz(25); if (m.tutorial === 2 && e.kills > 0) { m.tutorial = 3; this.tutT = 0; } break;
      }
    }
    ev.length = 0;
  },
  buzz(p) { if (PROFILE.settings.haptics && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) { /* ignore */ } } },
  // a few words for the first night, then silence
  tutor(dt) {
    const m = PROFILE.meta, w = this.w;
    if (m.tutorial >= 9) return;
    this.tutT += dt;
    if (m.tutorial === 0) { Hud.hint(T('tut.1')); m.tutorial = 1; this.tutT = 0; }
    else if (m.tutorial === 1 && this.tutT > 3.5) { Hud.hint(T('tut.2')); m.tutorial = 2; }
    else if (m.tutorial === 3) { if (this.tutT < 0.1) Hud.hint(T('tut.3')); if (this.tutT > 4) { Hud.hint(T('tut.4')); m.tutorial = 4; this.tutT = 0; } }
    else if (m.tutorial === 4 && this.tutT > 6) { Hud.hint(''); m.tutorial = 9; saveProfile(); }
    if (w.stage > 0 && m.tutorial < 9) { Hud.hint(''); m.tutorial = 9; saveProfile(); }
  },
};
if (typeof document !== 'undefined') { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot()); else App.boot(); }

})();
</script>
